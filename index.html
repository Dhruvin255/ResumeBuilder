<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge Pro — Domain-Aware</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F5F0;--surface:#fff;--border:#DDD9D0;--text:#1A1916;--text2:#6B6760;--accent:#1a4f8a;--green:#2C5F2E;--red:#C0392B}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--text);color:#fff;padding:14px 40px}
.logo{font-family:'DM Serif Display',serif;font-size:22px}
.logo span{color:#92B4E3}
.tagline{font-size:10px;color:#aaa;margin-top:4px}
.app{display:grid;grid-template-columns:420px 1fr;min-height:calc(100vh - 56px)}
.left{padding:28px 30px;border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 56px);display:flex;flex-direction:column}
.right{background:#FAFAF8;overflow-y:auto;max-height:calc(100vh - 56px);padding:24px 28px}
input,textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);background:var(--surface);margin-bottom:12px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-weight:500;cursor:pointer;margin-top:12px}
.btn:hover:not(:disabled){background:#133d6e}
.btn:disabled{background:var(--border);cursor:not-allowed}
.status{padding:12px;border-radius:7px;margin-bottom:12px;font-size:12px;display:none;font-weight:500}
.status.success{background:#EDF4EE;color:var(--green);border:1px solid #9DC89F}
.status.error{background:#FDF0EE;color:var(--red);border:1px solid #F5C6C2}
.status.loading{background:#FDF8EC;color:#8B6914;border:1px solid #F0D98A}
.preview{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;font-family:Calibri,sans-serif;font-size:11px;line-height:1.5;white-space:pre-wrap}
.domain-badge{display:inline-block;background:var(--accent);color:#fff;padding:4px 10px;border-radius:4px;font-size:9px;font-weight:700;margin-bottom:12px;text-transform:uppercase}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Resume<span>Forge</span> Pro</div>
  <div class="tagline">Domain-Aware • ML | Backend | Analytics | Data Science</div>
</div>

<div class="app">
  <div class="left">
    <div style="font-size:10px;color:var(--text2);margin-bottom:16px;padding:12px;background:#EEF4FF;border-radius:7px;border:1px solid #92B4E3">
      🔒 Education locked to: USC (3.40) + MPSTME (3.61)
    </div>

    <div style="margin-bottom:12px">
      <label style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;display:block;margin-bottom:4px">Job Description *</label>
      <textarea id="jd" placeholder="Paste full JD..." style="min-height:140px" oninput="updateCount()"></textarea>
      <div style="font-size:10px;color:var(--text2)" id="jd-count">0 chars</div>
    </div>

    <div style="margin-bottom:12px">
      <label style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;display:block;margin-bottom:4px">Company (optional)</label>
      <input type="text" id="company" placeholder="Google, Stripe...">
    </div>

    <div style="margin-bottom:12px">
      <label style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;display:block;margin-bottom:4px">API Key</label>
      <input type="password" id="api-key" placeholder="sk-ant-..." oninput="saveKey(this.value)">
    </div>

    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border)">
      <div id="status" class="status"></div>
      <button class="btn" id="gen-btn" onclick="generate()">🚀 Generate Resume</button>
      <div style="font-size:10px;color:var(--text2);margin-top:8px;line-height:1.6">Auto-detects domain • Uses your actual resume patterns • DOCX export</div>
    </div>
  </div>

  <div class="right">
    <div id="empty" style="text-align:center;padding:80px 20px;color:var(--text2)">
      <div style="font-size:48px;opacity:.2;margin-bottom:12px">⊙</div>
      <h3>Resume appears here</h3>
      <p>Paste JD, click Generate</p>
    </div>
    <div id="preview-area" style="display:none">
      <div id="preview" class="preview"></div>
      <button style="width:100%;padding:10px;background:var(--green);color:#fff;border:none;border-radius:7px;font-weight:500;cursor:pointer;margin-top:12px" onclick="downloadDOCX()">⬇ Download DOCX</button>
    </div>
  </div>
</div>

<script>
const DHRUVIN = {
  name: "Dhruvin Jhaveri",
  contact: "New York, NY | djhaveri99@gmail.com | linkedin.com/in/dhruvinjhaveri | github.com/Dhruvin255",
  education: [
    {
      school: "University of Southern California",
      location: "Los Angeles CA",
      degree: "M.S. Computer Science",
      track: "Data Science Track",
      gpa: "3.40",
      dates: "May 2026",
      coursework: "Applied ML, Distributed Systems, Analysis of Algorithms, Database Systems, Applied NLP, Foundations of Data Management"
    },
    {
      school: "SVKM MPSTME",
      location: "Mumbai India",
      degree: "B.Tech Computer Engineering",
      gpa: "3.61",
      dates: "May 2024",
      coursework: "Machine Learning, AI, Probability and Statistics, Big Data, Database Management Systems"
    }
  ]
};

const SYSTEM_PROMPTS = {
  ML: `You are writing a 1-page resume for Dhruvin optimized for ML/Data Science roles. 
Use this exact summary template:
"Machine learning engineer with [X] years building and deploying production ML systems, statistical models, and data pipelines. Expertise in SQL, Python (Pandas, NumPy, Scikit-Learn, PyTorch), and statistical analysis. Built [specific model] with [metric] accuracy, [specific model] achieving [metric], and [specific architecture]."

BULLET RULES:
- Lead with specific model name (XGBoost, BERT, etc), not generic "ML model"
- [Specific model] achieving [metric] across [scale] by [method]; [deployment detail]
- Examples: "Built end-to-end XGBoost ML pipeline for credit risk achieving 94% accuracy across 1K+ daily applications"
- "Reduced manual processing 90% and achieved 92% accuracy by fine-tuning BERT-based transformers"
- Never use: "worked on", "responsible for", "used machine learning"

EXPERIENCE ORDER: AWS (ML metrics first) > Imarticus (BERT/NLP) > Paypoint (XGBoost/models)

SKILLS (3-4 categories):
Languages: Python, SQL, C++, Java, JavaScript, R
ML & Deep Learning: PyTorch, TensorFlow, Scikit-Learn, XGBoost, BERT, LangChain, RAG, Feature Engineering, Hyperparameter Tuning
Data Pipelines: ETL, Pandas, NumPy, Matplotlib
Cloud & Infrastructure: AWS (S3, EC2, Redshift, SageMaker), Docker, Git

Return ONLY valid JSON with NO text before/after:
{"summary":"","experience":[{"company":"","location":"","title":"","dates":"","bullets":["",""]}],"projects":[{"title":"","tools":"","bullets":["",""]}],"skills":[{"label":"","value":""}]}`,

  BACKEND: `You are writing a 1-page resume for Dhruvin optimized for Backend/Systems roles.
Use this summary template:
"Backend and distributed systems software engineer with production experience building fault-tolerant C++ systems at Amazon AWS, high-throughput microservices APIs serving [SCALE], and cloud-deployed applications end to end. Strong foundations in object-oriented design, system design, data structures, and algorithms."

BULLET RULES:
- Lead with architecture pattern: "fault-tolerant", "distributed", "latency-aware", "high-throughput"
- [Metric improvement] across [scale] by [architecture]; [full ownership language]; [SDLC detail]
- Examples: "Improved p99 latency 35% by designing fault-tolerant auto-scaling in C++; full ownership from system design through production deployment"
- "Designed high-throughput REST API serving 50K+ daily requests at <100ms latency in Node.js/Express; fully owned from architecture through deployment"
- MANDATORY: "with full ownership from [X] through [Y]" or include "unit/integration tests", "design reviews", "staged deployment"

EXPERIENCE ORDER: AWS (C++/distributed) > Imarticus (Node.js/APIs) > Paypoint (MERN/full-stack)

SKILLS (3-4 categories):
Languages: Java, Python, C++, JavaScript, TypeScript, SQL, R
Core CS: Object-Oriented Design, System Design, Data Structures and Algorithms, Distributed Systems, Concurrency, Scalability
Backend: Node.js, Express.js, NestJS, Spring Boot, REST APIs, Microservices Architecture
Infrastructure: Linux, Unix, Docker, CI/CD, Git, Agile
Cloud: AWS (S3, EC2, Redshift), GCP, Azure
Databases: PostgreSQL, MySQL, MongoDB, Redis

Return ONLY valid JSON:
{"summary":"","experience":[{"company":"","location":"","title":"","dates":"","bullets":["",""]}],"projects":[{"title":"","tools":"","bullets":["",""]}],"skills":[{"label":"","value":""}]}`,

  ANALYTICS: `You are writing a 1-page resume for Dhruvin optimized for Analytics/Operations roles.
Use this summary template:
"Operations analytics professional with expertise in synthesizing complex organizational data for executive decision-making. Proven ability in business intelligence, data transformation, and stakeholder management. Skilled in Tableau, Alteryx, Power BI and advanced data tools with demonstrated ability to quickly learn new technologies and translate insights into actionable business strategies."

BULLET RULES:
- Executive-facing language: "executive decision-making", "stakeholder", "C-suite", "organizational leaders"
- [Dashboard/automation] tracking [KPIs] improved [metric] by [%] by [collaboration detail]
- Examples: "Built Tableau dashboards tracking KPIs across teams, improving executive responsiveness by 40%"
- "Developed Power BI dashboards synthesizing employee engagement and business metrics for C-suite communication"
- Stakeholder management is CORE: mention cross-functional partners, senior leaders, organizational levels

EXPERIENCE ORDER: AWS (analytics/dashboards) > Imarticus (dashboards/KPIs) > Paypoint (reporting)

SKILLS (3-4 categories):
BI & Analytics: Tableau, Power BI, Alteryx, SQL, Excel (Advanced)
Languages: Python, SQL, C++, JavaScript
Data Platforms: AWS Redshift, LLM Solutions
Soft Skills: Executive Communication, Cross-Functional Collaboration, Stakeholder Management, Meeting Facilitation

Return ONLY valid JSON:
{"summary":"","experience":[{"company":"","location":"","title":"","dates":"","bullets":["",""]}],"projects":[{"title":"","tools":"","bullets":["",""]}],"skills":[{"label":"","value":""}]}`,

  DATA_SCI: `You are writing a 1-page resume for Dhruvin optimized for Data Scientist/Analyst roles.
Use this summary template:
"Data scientist with production experience in SQL, Python, R, ETL pipelines, A/B testing, regression modeling, and statistical analysis across [DOMAIN] environments. Skilled at taking ambiguous problems, structuring them as hypotheses, and using data to drive decisions for business and product leaders. Experienced building full-cycle analytics experiments, executive-facing dashboards, and cohort analyses that identify levers and move essential metrics."

BULLET RULES:
- Problem-first: "Worked backwards from ambiguous [problem] to structured data solution"
- Full-cycle: "Built full-cycle analytics [experiment/pipeline] using [TOOLS] on [INFRASTRUCTURE]"
- Statistical rigor: always mention "hypothesis testing", "regression modeling", "A/B testing", "cohort analyses"
- [Full-cycle detail] analyzing [scale] using [tools], applying [statistical methods], [identifying/validating] [insight], [business impact]
- Examples: "Built full-cycle analytics pipeline analyzing 5K+ records using Python, regression models, cohort analyses to surface engagement trends"
- "Worked backwards from ambiguous performance problem to structured SQL/Python solution, running hypothesis testing and A/B tests to validate findings"

EXPERIENCE ORDER: AWS (analytics experiments) > Imarticus (behavioral analysis) > Paypoint (statistical modeling)

SKILLS (3-4 categories):
Analytics & Statistics: SQL, Python, R, Pandas, NumPy, Scikit-Learn, SciPy, Statsmodels, A/B Testing, Hypothesis Testing, Regression, Time-Series, Cohort Analysis
ETL & Data Infrastructure: ETL pipelines, data modeling, data validation, AWS (S3, EC2, Redshift), PostgreSQL, MongoDB, Airflow, Git
Visualization & BI: Tableau, Looker, Power BI, Matplotlib, Seaborn, Excel
Machine Learning: XGBoost, PyTorch, TensorFlow, BERT, LangChain, user segmentation, funnel optimization

Return ONLY valid JSON:
{"summary":"","experience":[{"company":"","location":"","title":"","dates":"","bullets":["",""]}],"projects":[{"title":"","tools":"","bullets":["",""]}],"skills":[{"label":"","value":""}]}`
};

let currentResume = null;

function updateCount(){
  document.getElementById('jd-count').textContent = document.getElementById('jd').value.length.toLocaleString() + ' chars';
}

function saveKey(k){
  if(k) localStorage.setItem('dhruvin_api_key', k);
  window.API_KEY = k;
}

function detectDomain(jd){
  const lower = jd.toLowerCase();
  const domains = {
    ML: ['pytorch', 'tensorflow', 'bert', 'xgboost', 'nlp', 'deep learning', 'neural network', 'machine learning', 'feature engineering', 'model training'],
    BACKEND: ['distributed systems', 'apis', 'microservices', 'concurrency', 'c++', 'scalability', 'throughput', 'latency', 'fault tolerance'],
    ANALYTICS: ['tableau', 'alteryx', 'power bi', 'executive', 'stakeholder', 'business intelligence', 'dashboard', 'reporting'],
    DATA_SCI: ['sql', 'python', 'a/b testing', 'hypothesis testing', 'statistical analysis', 'regression', 'cohort analysis', 'etl']
  };

  let scores = { ML: 0, BACKEND: 0, ANALYTICS: 0, DATA_SCI: 0 };
  for(let [domain, keywords] of Object.entries(domains)){
    keywords.forEach(kw => {
      if(lower.includes(kw)) scores[domain]++;
    });
  }

  const best = Object.keys(scores).reduce((a,b) => scores[a] > scores[b] ? a : b);
  return scores[best] > 0 ? best : 'BACKEND';
}

async function generate(){
  const jd = document.getElementById('jd').value.trim();
  const apiKey = document.getElementById('api-key').value.trim();
  const company = document.getElementById('company').value.trim() || 'the company';

  if(!apiKey){ setStatus('error', '❌ API key required'); return; }
  if(!jd){ setStatus('error', '❌ Paste job description'); return; }

  document.getElementById('gen-btn').disabled = true;
  
  const domain = detectDomain(jd);
  const prompt = SYSTEM_PROMPTS[domain] || SYSTEM_PROMPTS.BACKEND;
  
  setStatus('loading', `⧖ Generating ${domain} resume...`);

  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 3500,
        system: prompt,
        messages: [{role: 'user', content: `JD:\n${jd}\n\nCOMPANY: ${company}\n\nGenerate 1-page resume. Return ONLY JSON.`}]
      })
    });

    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message);

    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const json = text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const resume = JSON.parse(json);

    resume.name = DHRUVIN.name;
    resume.contact = DHRUVIN.contact;
    resume.education = DHRUVIN.education;
    resume.domain = domain;

    currentResume = resume;
    renderResume(resume, domain);
    setStatus('success', `✓ Generated (${domain})`);

  }catch(err){
    setStatus('error', '❌ ' + err.message);
  }finally{
    document.getElementById('gen-btn').disabled = false;
  }
}

function setStatus(type, msg){
  const s = document.getElementById('status');
  s.className = 'status ' + type;
  s.textContent = msg;
  s.style.display = 'block';
}

function renderResume(r, domain){
  document.getElementById('empty').style.display = 'none';
  const p = document.getElementById('preview-area');
  p.style.display = 'block';

  let text = `${r.name}
${r.contact}

DOMAIN: ${domain}

SUMMARY
${r.summary}

EXPERIENCE
${(r.experience || []).map(e => `${e.company} • ${e.location}
${e.title} | ${e.dates}
${(e.bullets || []).map(b => `• ${b}`).join('\n')}`).join('\n\n')}

PROJECTS
${(r.projects || []).map(p => `${p.title} • ${p.tools}
${(p.bullets || []).map(b => `• ${b}`).join('\n')}`).join('\n\n')}

SKILLS
${(r.skills || []).map(s => `${s.label}: ${s.value}`).join('\n')}

EDUCATION
${DHRUVIN.education.map(e => `${e.school}, ${e.location}
${e.degree} • GPA ${e.gpa} • ${e.dates}
Coursework: ${e.coursework}`).join('\n\n')}`;

  document.getElementById('preview').textContent = text;
}

function downloadDOCX(){
  if(!currentResume) return;
  const r = currentResume;
  
  const doc = new window.docx.Document({
    sections: [{
      margins: { top: 432, bottom: 432, left: 720, right: 720 },
      children: [
        new window.docx.Paragraph({ text: r.name, bold: true, size: 24, alignment: window.docx.AlignmentType.CENTER }),
        new window.docx.Paragraph({ text: r.contact, size: 18, alignment: window.docx.AlignmentType.CENTER, spacing: { after: 200 }, border: { bottom: { color: "1a4f8a", space: 1, style: "single", size: 12 } } }),
        
        ...(r.summary ? [
          new window.docx.Paragraph({ text: "SUMMARY", bold: true, size: 18, color: "1a4f8a", spacing: { before: 100, after: 100 } }),
          new window.docx.Paragraph({ text: r.summary, size: 18, spacing: { after: 200 } })
        ] : []),

        ...(r.experience ? [
          new window.docx.Paragraph({ text: "EXPERIENCE", bold: true, size: 18, color: "1a4f8a", spacing: { before: 100, after: 100 } }),
          ...r.experience.flatMap(e => [
            new window.docx.Paragraph({ text: `${e.company} • ${e.location}`, bold: true, size: 18 }),
            new window.docx.Paragraph({ text: `${e.title} | ${e.dates}`, size: 18, italics: true, color: "6B6760", spacing: { after: 100 } }),
            ...(e.bullets || []).map(b => new window.docx.Paragraph({ text: b, size: 18, spacing: { after: 80 }, indent: { left: 720, hanging: 360 }, bullet: { level: 0 } }))
          ])
        ] : []),

        ...(r.projects ? [
          new window.docx.Paragraph({ text: "PROJECTS", bold: true, size: 18, color: "1a4f8a", spacing: { before: 100, after: 100 } }),
          ...r.projects.flatMap(p => [
            new window.docx.Paragraph({ text: p.title, bold: true, size: 18 }),
            new window.docx.Paragraph({ text: p.tools, size: 18, color: "6B6760", spacing: { after: 100 } }),
            ...(p.bullets || []).map(b => new window.docx.Paragraph({ text: b, size: 18, spacing: { after: 80 }, indent: { left: 720, hanging: 360 }, bullet: { level: 0 } }))
          ])
        ] : []),

        ...(r.skills ? [
          new window.docx.Paragraph({ text: "SKILLS", bold: true, size: 18, color: "1a4f8a", spacing: { before: 100, after: 100 } }),
          ...r.skills.map(s => new window.docx.Paragraph({ text: `${s.label}: ${s.value}`, size: 18, spacing: { after: 80 } }))
        ] : []),

        new window.docx.Paragraph({ text: "EDUCATION", bold: true, size: 18, color: "1a4f8a", spacing: { before: 100, after: 100 } }),
        ...DHRUVIN.education.flatMap(e => [
          new window.docx.Paragraph({ text: `${e.school}, ${e.location}`, bold: true, size: 18 }),
          new window.docx.Paragraph({ text: `${e.degree} • GPA ${e.gpa} • ${e.dates}`, size: 18, color: "6B6760", spacing: { after: 100 } }),
          new window.docx.Paragraph({ text: `Coursework: ${e.coursework}`, size: 18, color: "9B978F", spacing: { after: 100 } })
        ])
      ]
    }]
  });

  window.docx.Packer.toBlob(doc).then(blob => {
    saveAs(blob, `Dhruvin_Jhaveri_${r.domain}_Resume.docx`);
    setStatus('success', '✓ Downloaded!');
  });
}

window.addEventListener('load', () => {
  const saved = localStorage.getItem('dhruvin_api_key');
  if(saved) { document.getElementById('api-key').value = saved; window.API_KEY = saved; }
});
</script>
</body>
</html>
