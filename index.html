<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge — Pick Your Type</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F5F0;--surface:#fff;--border:#DDD9D0;--text:#1A1916;--text2:#6B6760;--accent:#1a4f8a;--green:#2C5F2E;--red:#C0392B}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--text);color:#fff;padding:14px 40px}
.logo{font-family:'DM Serif Display',serif;font-size:20px}
.logo span{color:#92B4E3}
.app{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 56px)}
.left{padding:24px 28px;border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 56px);display:flex;flex-direction:column}
.right{background:#FAFAF8;overflow-y:auto;max-height:calc(100vh - 56px);padding:20px 24px;font-family:Calibri,sans-serif;font-size:10.5px}
.type-selector{display:grid;gap:12px;margin-bottom:20px}
.type-card{padding:14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;background:var(--surface)}
.type-card:hover{border-color:var(--accent);background:#F0F4FF}
.type-card.selected{border-color:var(--accent);background:#EEF4FF;font-weight:600}
.type-title{font-weight:700;font-size:12px;margin-bottom:4px;color:var(--text)}
.type-desc{font-size:10px;color:var(--text2);line-height:1.4}
input,textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);background:var(--surface);margin-bottom:10px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;margin-top:10px;font-size:13px}
.btn:hover:not(:disabled){background:#133d6e}
.btn:disabled{background:var(--border);cursor:not-allowed;color:var(--text2)}
.status{padding:10px;border-radius:6px;margin-bottom:10px;font-size:11px;display:none;font-weight:600}
.status.success{background:#EDF4EE;color:var(--green);border:1px solid #9DC89F}
.status.error{background:#FDF0EE;color:var(--red);border:1px solid #F5C6C2}
.status.loading{background:#FDF8EC;color:#8B6914;border:1px solid #F0D98A}
.portfolio-preview{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:10px;font-size:9px;color:var(--text2);line-height:1.4}
.portfolio-preview strong{color:var(--text);display:block;margin-bottom:4px}
.preview{line-height:1.4;white-space:pre-wrap;font-size:10px}
.hidden{display:none}
.section-label{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-top:12px;margin-bottom:6px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Resume<span>Forge</span></div>
  <div style="font-size:10px;color:#999;margin-top:2px">Pick your type • Auto-fill portfolio • Generate</div>
</div>

<div class="app">
  <div class="left">
    <div class="section-label">Resume Type</div>
    <div class="type-selector" id="type-selector"></div>

    <div class="section-label">Portfolio Links (Auto-Filled)</div>
    <div class="portfolio-preview" id="portfolio-preview">
      <strong>Select a type above</strong>
      <div>Portfolio links will appear here</div>
    </div>

    <div class="section-label">Job Description</div>
    <textarea id="jd" placeholder="Paste full JD..." style="min-height:120px" oninput="updateCount()"></textarea>
    <div style="font-size:9px;color:var(--text2)" id="jd-count">0 chars</div>

    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--border)">
      <div id="status" class="status"></div>
      <button class="btn" id="gen-btn" onclick="generate()" disabled>🚀 Generate Resume</button>
      <div style="font-size:9px;color:var(--text2);margin-top:6px;line-height:1.5">✓ 1-page tight ✓ Correct portfolio ✓ DOCX ready</div>
    </div>
  </div>

  <div class="right">
    <div id="preview" class="preview" style="text-align:center;padding:60px 20px;color:var(--text2)">
      Select resume type + paste JD<br>
      <span style="font-size:48px;opacity:.1;margin-top:12px;display:block">⊙</span>
    </div>
    <button style="width:100%;padding:8px;background:var(--green);color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer;margin-top:12px;font-size:11px;display:none" id="dl-btn" onclick="downloadDOCX()">⬇ Download DOCX</button>
  </div>
</div>

<script>
const RESUME_TYPES = {
  SDE: {
    title: "Backend/SDE Engineer",
    description: "Distributed systems, APIs, microservices, C++, fault tolerance, production deployment",
    portfolios: ["https://dhruvin255.github.io/PortfolioHost/sde.html"],
    domain: "BACKEND"
  },
  ML: {
    title: "ML Engineer / Data Scientist",
    description: "PyTorch, TensorFlow, BERT, XGBoost, feature engineering, model training, statistical analysis",
    portfolios: ["https://dhruvin255.github.io/PortfolioHost/ml.html"],
    domain: "ML"
  },
  DATA: {
    title: "Data Analyst / Analytics",
    description: "SQL, Python, A/B testing, hypothesis testing, dashboards, business intelligence, metrics",
    portfolios: ["https://dhruvin255.github.io/PortfolioHost/data.html"],
    domain: "DATA"
  },
  FULL: {
    title: "Full-Stack (All 3 Portfolios)",
    description: "Show all sides: backend, ML, and data analytics expertise across roles",
    portfolios: [
      "https://dhruvin255.github.io/PortfolioHost/sde.html",
      "https://dhruvin255.github.io/PortfolioHost/ml.html",
      "https://dhruvin255.github.io/PortfolioHost/data.html"
    ],
    domain: "FULL"
  }
};

const DHRUVIN = {
  name: "DHRUVIN JHAVERI",
  location: "New York, NY",
  phone: "(602) 793-6561",
  email: "dhruvinj@usc.edu",
  education: [
    {
      school: "University of Southern California",
      location: "Los Angeles, USA",
      degree: "Master of Science in Computer Science (Data Science)",
      gpa: null,
      dates: "Graduating May 2026",
      coursework: "Analysis of Algorithms, Database Systems, Applied ML, Web Technologies, Distributed Systems, Machine Learning for Data Science"
    },
    {
      school: "SVKM Mukesh Patel School of Technology Management and Engineering",
      location: "Mumbai, India",
      degree: "Bachelor of Technology in Computer Engineering (Honors: ML and Data Analytics)",
      gpa: "3.61/4.0",
      dates: "May 2024",
      coursework: "NLP, ML, AI, Big Data, Database Management Systems, Cloud Computing, Blockchain Technology"
    }
  ]
};

let selectedType = null;
let currentResume = null;

function initTypeSelector() {
  const selector = document.getElementById('type-selector');
  selector.innerHTML = Object.entries(RESUME_TYPES).map(([key, type]) => `
    <div class="type-card" onclick="selectType('${key}')">
      <div class="type-title">📌 ${type.title}</div>
      <div class="type-desc">${type.description}</div>
    </div>
  `).join('');
}

function selectType(typeKey) {
  selectedType = typeKey;
  const type = RESUME_TYPES[typeKey];
  
  // Update UI
  document.querySelectorAll('.type-card').forEach(el => el.classList.remove('selected'));
  event.target.closest('.type-card').classList.add('selected');
  
  // Show portfolio preview
  const previewEl = document.getElementById('portfolio-preview');
  previewEl.innerHTML = `<strong>✓ Portfolio Links (${type.portfolios.length}):</strong>` + 
    type.portfolios.map((p, i) => `<div>${i+1}. ${p}</div>`).join('');
  
  // Enable generate button
  document.getElementById('gen-btn').disabled = document.getElementById('jd').value.trim().length === 0;
}

function updateCount() {
  const hasJD = document.getElementById('jd').value.trim().length > 0;
  document.getElementById('gen-btn').disabled = !selectedType || !hasJD;
  document.getElementById('jd-count').textContent = document.getElementById('jd').value.length.toLocaleString() + ' chars';
}

function setStatus(type, msg) {
  const s = document.getElementById('status');
  s.className = 'status ' + type;
  s.textContent = msg;
  s.style.display = 'block';
}

const SYSTEM_PROMPTS = {
  BACKEND: `You are writing a 1-PAGE resume for Dhruvin optimized for Backend/SDE roles.

STRUCTURE (strict):
1. HEADER: DHRUVIN JHAVERI | Location, Phone, Email | Portfolio: https://dhruvin255.github.io/PortfolioHost/sde.html
2. EDUCATION (no summary) - School, Degree, GPA, Dates, Coursework inline
3. PROFESSIONAL EXPERIENCE - Company @ Title | TECH STACK (inline) | Dates
   - 3-4 bullets per role, SHORT and PUNCHY
4. PROJECTS (2 max) - Title | Tech | Dates, 2-3 bullets
5. RESEARCH (1 line only, optional)
6. TECHNICAL SKILLS - Grouped by category at bottom

RULES:
- Tech stack inline in header: "C++, AWS, Docker, Git"
- Bullets SHORT (1-2 lines max)
- Lead with architecture pattern: "fault-tolerant", "high-throughput", "latency-aware"
- Metric first: "Improved p99 latency 35% by designing..."
- Full ownership language: "with full ownership from X through Y"
- SDLC detail: mention tests, design reviews, or deployment
- NO wordy language, NO "worked on", NO "responsible for"

EDUCATION LOCKED:
University of Southern California, Los Angeles, USA | M.S. Computer Science (Data Science) | Graduating May 2026
SVKM MPSTME, Mumbai, India | B.Tech Computer Engineering (Honors) | GPA 3.61/4.0 | May 2024

Return ONLY JSON (no markdown):
{"roles":[{"company":"","title":"","tech":"","dates":"","bullets":[""]}],"projects":[{"title":"","tech":"","dates":"","bullets":[""]}],"research":"","skills":[{"category":"","items":""}]}`,

  ML: `You are writing a 1-PAGE resume for Dhruvin optimized for ML/Data Science roles.

STRUCTURE (strict):
1. HEADER: DHRUVIN JHAVERI | Location, Phone, Email | Portfolio: https://dhruvin255.github.io/PortfolioHost/ml.html
2. EDUCATION (no summary) - School, Degree, GPA, Dates, Coursework inline
3. PROFESSIONAL EXPERIENCE - Company @ Title | TECH STACK (inline) | Dates
   - 3-4 bullets per role, SHORT
4. PROJECTS (2 max) - Title | Tech | Dates, 2-3 bullets
5. RESEARCH (1 line, optional)
6. TECHNICAL SKILLS - Grouped by category

RULES:
- Tech inline: "PyTorch, TensorFlow, XGBoost, BERT, Python"
- Lead with model/system: "Built XGBoost fraud model with 94% accuracy"
- Metric first: "Achieved 92% classification accuracy on 5K+ records by fine-tuning BERT"
- Include deployment detail: "deployed as backend service", "in production"
- Feature engineering, hyperparameter tuning, evaluation mentioned
- NO generic "machine learning", say the TOOL (XGBoost, BERT, etc)

EDUCATION LOCKED:
University of Southern California, Los Angeles, USA | M.S. Computer Science (Data Science) | Graduating May 2026
SVKM MPSTME, Mumbai, India | B.Tech Computer Engineering (Honors) | GPA 3.61/4.0 | May 2024

Return ONLY JSON:
{"roles":[{"company":"","title":"","tech":"","dates":"","bullets":[""]}],"projects":[{"title":"","tech":"","dates":"","bullets":[""]}],"research":"","skills":[{"category":"","items":""}]}`,

  DATA: `You are writing a 1-PAGE resume for Dhruvin optimized for Analytics/Data roles.

STRUCTURE (strict):
1. HEADER: DHRUVIN JHAVERI | Location, Phone, Email | Portfolio: https://dhruvin255.github.io/PortfolioHost/data.html
2. EDUCATION (no summary) - School, Degree, GPA, Dates, Coursework inline
3. PROFESSIONAL EXPERIENCE - Company @ Title | TECH STACK (inline) | Dates
   - 3-4 bullets per role
4. PROJECTS (2 max) - Title | Tech | Dates, 2-3 bullets
5. RESEARCH (1 line, optional)
6. TECHNICAL SKILLS - Grouped by category

RULES:
- Tech inline: "SQL, Python, Tableau, A/B Testing, Hypothesis Testing"
- Lead with problem-first or metric-first: "Built full-cycle analytics pipeline analyzing 5K+ records"
- Statistical rigor: mention "A/B testing", "hypothesis testing", "regression", "cohort analysis"
- Executive translation: "dashboards for stakeholders", "data-driven decisions"
- Full-cycle language: "from data collection through validation"
- Metric impact: "Improved KPI by X%", "reduced manual time 80%"

EDUCATION LOCKED:
University of Southern California, Los Angeles, USA | M.S. Computer Science (Data Science) | Graduating May 2026
SVKM MPSTME, Mumbai, India | B.Tech Computer Engineering (Honors) | GPA 3.61/4.0 | May 2024

Return ONLY JSON:
{"roles":[{"company":"","title":"","tech":"","dates":"","bullets":[""]}],"projects":[{"title":"","tech":"","dates":"","bullets":[""]}],"research":"","skills":[{"category":"","items":""}]}`,

  FULL: `You are writing a 1-PAGE resume for Dhruvin showing FULL STACK skills (Backend, ML, Data).

STRUCTURE (strict 1-page):
1. HEADER: DHRUVIN JHAVERI | Location, Phone, Email | Portfolios: SDE | ML | Data Analytics
   (show all 3 portfolio links)
2. EDUCATION (no summary) - School, Degree, GPA, Dates, Coursework inline
3. PROFESSIONAL EXPERIENCE - Pick 3-4 roles that span Backend, ML, and Data
   - Each role: Company @ Title | TECH STACK | Dates, 2-3 bullets (super tight to fit)
4. PROJECTS (1-2 max, pick diverse: one backend, one ML, one data if space)
5. RESEARCH (1 line if space)
6. TECHNICAL SKILLS - Grouped (Languages, Backend, ML, Data, Tools)

RULES:
- TIGHT: 2-3 bullets per role max (not 3-4) to show breadth in 1 page
- Tech inline and diverse: "C++, Node.js, Docker" | "PyTorch, BERT, XGBoost" | "SQL, Tableau, A/B Testing"
- Lead each bullet with the SPECIFIC contribution + metric + tech
- NO fluff, every word counts
- Show full-stack capability: backend building blocks, ML models, data insights

EDUCATION LOCKED:
University of Southern California, Los Angeles, USA | M.S. Computer Science (Data Science) | Graduating May 2026
SVKM MPSTME, Mumbai, India | B.Tech Computer Engineering (Honors) | GPA 3.61/4.0 | May 2024

Return ONLY JSON:
{"roles":[{"company":"","title":"","tech":"","dates":"","bullets":[""]}],"projects":[{"title":"","tech":"","dates":"","bullets":[""]}],"research":"","skills":[{"category":"","items":""}]}`
};

async function generate() {
  const jd = document.getElementById('jd').value.trim();
  const apiKey = localStorage.getItem('dhruvin_api_key') || prompt('Enter API key:');
  
  if(!apiKey) {
    setStatus('error', '❌ API key required');
    return;
  }
  
  localStorage.setItem('dhruvin_api_key', apiKey);
  
  if(!selectedType || !jd) {
    setStatus('error', '❌ Select type and paste JD');
    return;
  }

  document.getElementById('gen-btn').disabled = true;
  const type = RESUME_TYPES[selectedType];
  setStatus('loading', `⧖ Generating ${type.title}...`);

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 3500,
        system: SYSTEM_PROMPTS[type.domain],
        messages: [{role: 'user', content: `JD:\n${jd}\n\nGenerate 1-page resume. Return ONLY JSON.`}]
      })
    });

    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message);

    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const json = text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const resume = JSON.parse(json);

    currentResume = { ...resume, type: selectedType, portfolios: type.portfolios };
    renderResume(resume, type.portfolios);
    setStatus('success', `✓ Generated! Download your ${type.title} resume.`);

  } catch(err) {
    setStatus('error', '❌ ' + err.message);
  } finally {
    document.getElementById('gen-btn').disabled = false;
  }
}

function renderResume(r, portfolios) {
  const portfolioStr = portfolios.map((p, i) => i === 0 ? p : ` | ${p}`).join('');
  
  let text = `${DHRUVIN.name}
${DHRUVIN.location} | ${DHRUVIN.phone} | ${DHRUVIN.email} | LinkedIn | GitHub | Website | ${portfolioStr}

EDUCATION

${DHRUVIN.education[0].school} ${DHRUVIN.education[0].location}
${DHRUVIN.education[0].degree} | ${DHRUVIN.education[0].dates}
Relevant Coursework – ${DHRUVIN.education[0].coursework}

${DHRUVIN.education[1].school} ${DHRUVIN.education[1].location}
${DHRUVIN.education[1].degree} | GPA ${DHRUVIN.education[1].gpa} | ${DHRUVIN.education[1].dates}
Relevant Coursework – ${DHRUVIN.education[1].coursework}

PROFESSIONAL EXPERIENCE

${(r.roles || []).map(role => `${role.company} @ ${role.title} | ${role.tech} | ${role.dates}
${(role.bullets || []).map(b => `• ${b}`).join('\n')}`).join('\n\n')}

${r.projects && r.projects.length ? `PROJECTS

${r.projects.map(p => `${p.title} | ${p.tech} | ${p.dates}
${(p.bullets || []).map(b => `• ${b}`).join('\n')}`).join('\n\n')}

` : ''}${r.research ? `RESEARCH WORK

${r.research}

` : ''}TECHNICAL SKILLS & ACHIEVEMENTS

${(r.skills || []).map(s => `${s.category}: ${s.items}`).join('\n')}`;

  document.getElementById('preview').textContent = text;
  document.getElementById('dl-btn').style.display = 'block';
}

function downloadDOCX() {
  if(!currentResume) return;
  
  const type = RESUME_TYPES[currentResume.type];
  const portfolioStr = currentResume.portfolios.map((p, i) => i === 0 ? p : ` | ${p}`).join('');
  
  const doc = new window.docx.Document({
    sections: [{
      margins: { top: 432, bottom: 432, left: 720, right: 720 },
      children: [
        new window.docx.Paragraph({
          text: DHRUVIN.name,
          bold: true,
          size: 22,
          alignment: window.docx.AlignmentType.CENTER,
          spacing: { after: 0 }
        }),
        new window.docx.Paragraph({
          text: `${DHRUVIN.location} | ${DHRUVIN.phone} | ${DHRUVIN.email} | LinkedIn | GitHub | Website | ${portfolioStr}`,
          size: 18,
          alignment: window.docx.AlignmentType.CENTER,
          spacing: { after: 100 }
        }),

        new window.docx.Paragraph({ text: "EDUCATION", bold: true, size: 18, spacing: { before: 50, after: 100 } }),
        ...DHRUVIN.education.flatMap(e => [
          new window.docx.Paragraph({ text: `${e.school} ${e.location}`, bold: true, size: 18, spacing: { after: 0 } }),
          new window.docx.Paragraph({ text: `${e.degree} | ${e.dates}${e.gpa ? ` | GPA ${e.gpa}` : ''}`, size: 18, spacing: { after: 40 } }),
          new window.docx.Paragraph({ text: `Relevant Coursework – ${e.coursework}`, size: 18, spacing: { after: 100 }, italics: true })
        ]),

        new window.docx.Paragraph({ text: "PROFESSIONAL EXPERIENCE", bold: true, size: 18, spacing: { before: 50, after: 100 } }),
        ...(currentResume.roles || []).flatMap(role => [
          new window.docx.Paragraph({ text: `${role.company} @ ${role.title} | ${role.tech} | ${role.dates}`, bold: true, size: 18, spacing: { after: 60 } }),
          ...(role.bullets || []).map(b => new window.docx.Paragraph({ text: b, size: 18, spacing: { after: 40 }, indent: { left: 360, hanging: 360 }, bullet: { level: 0 } })),
          new window.docx.Paragraph({ text: "", spacing: { after: 60 } })
        ]),

        ...(currentResume.projects ? [
          new window.docx.Paragraph({ text: "PROJECTS", bold: true, size: 18, spacing: { before: 50, after: 100 } }),
          ...(currentResume.projects || []).flatMap(p => [
            new window.docx.Paragraph({ text: `${p.title} | ${p.tech} | ${p.dates}`, bold: true, size: 18, spacing: { after: 60 } }),
            ...(p.bullets || []).map(b => new window.docx.Paragraph({ text: b, size: 18, spacing: { after: 40 }, indent: { left: 360, hanging: 360 }, bullet: { level: 0 } }))
          ])
        ] : []),

        ...(currentResume.research ? [
          new window.docx.Paragraph({ text: "RESEARCH WORK", bold: true, size: 18, spacing: { before: 50, after: 100 } }),
          new window.docx.Paragraph({ text: currentResume.research, size: 18, spacing: { after: 100 } })
        ] : []),

        new window.docx.Paragraph({ text: "TECHNICAL SKILLS & ACHIEVEMENTS", bold: true, size: 18, spacing: { before: 50, after: 100 } }),
        ...(currentResume.skills || []).map(s => new window.docx.Paragraph({ text: `${s.category}: ${s.items}`, size: 18, spacing: { after: 60 } }))
      ]
    }]
  });

  window.docx.Packer.toBlob(doc).then(blob => {
    const typeLabel = type.title.replace(/\//g, '_').replace(/ /g, '_');
    saveAs(blob, `Dhruvin_Jhaveri_${typeLabel}.docx`);
    setStatus('success', '✓ Downloaded!');
  });
}

window.addEventListener('load', () => {
  initTypeSelector();
});
</script>
</body>
</html>
