<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0e0e11;
    --surface: #17171c;
    --surface2: #1e1e26;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --accent: #7c6af7;
    --accent2: #5febc4;
    --text: #f0eff8;
    --muted: #8884a4;
    --danger: #f06b6b;
    --success: #5febc4;
    --warn: #f7c46a;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-version { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }

  .field-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
  }

  input[type="text"], input[type="password"], textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }

  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    border-color: var(--accent);
  }

  input[type="password"] { font-family: 'DM Mono', monospace; font-size: 13px; }

  textarea { min-height: 110px; resize: vertical; font-size: 13px; line-height: 1.5; }

  .track-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }

  .track-btn {
    padding: 9px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .track-btn:hover { border-color: var(--border2); color: var(--text); }
  .track-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* ── MAIN AREA ── */
  .main {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: #6a59e0; }

  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .btn-secondary:hover:not(:disabled) { background: #26263a; }

  .btn-success { background: #1a3a32; color: var(--success); border: 1px solid #2a5a4a; }
  .btn-success:hover:not(:disabled) { background: #1f4a3e; }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-icon { font-size: 16px; }

  .status-bar {
    padding: 10px 28px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .status-bar.show { display: flex; }
  .status-bar.error { color: var(--danger); background: rgba(240,107,107,0.08); }
  .status-bar.success { color: var(--success); background: rgba(95,235,196,0.08); }
  .status-bar.info { color: var(--accent2); background: rgba(95,235,196,0.05); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    gap: 0;
  }

  .tab {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--success); color: #000;
    font-size: 10px; margin-left: 6px;
  }

  /* ── CONTENT AREA ── */
  .content {
    flex: 1;
    padding: 24px 28px;
    overflow-y: auto;
  }

  .preview-pane {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    color: #c8c4e8;
    white-space: pre-wrap;
    max-height: 65vh;
    overflow-y: auto;
    min-height: 200px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    gap: 12px;
    color: var(--muted);
  }

  .empty-icon { font-size: 40px; opacity: 0.4; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text); opacity: 0.5; }
  .empty-sub { font-size: 13px; text-align: center; max-width: 300px; line-height: 1.5; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .ats-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  .ats-value {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--accent2);
    min-width: 36px;
    text-align: right;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Responsive */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="logo-text">ResumeForge</div>
        <div class="logo-version">v2.0 — ATS Engine</div>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">Anthropic API Key</div>
      <input type="password" id="apiKey" placeholder="sk-ant-...">
    </div>

    <div class="divider"></div>

    <div class="field-group">
      <div class="field-label">Company</div>
      <input type="text" id="company" placeholder="Google">
    </div>

    <div class="field-group">
      <div class="field-label">Job Title</div>
      <input type="text" id="jobTitle" placeholder="Software Engineer">
    </div>

    <div class="field-group">
      <div class="field-label">Contact Location</div>
      <input type="text" id="location" placeholder="New York, NY" value="New York, NY">
    </div>

    <div class="field-group">
      <div class="field-label">Job Description</div>
      <textarea id="jd" placeholder="Paste full job description here..."></textarea>
    </div>

    <div class="field-group">
      <div class="field-label">Track</div>
      <div class="track-grid">
        <button class="track-btn" data-track="sde">SDE</button>
        <button class="track-btn" data-track="backend">Backend</button>
        <button class="track-btn" data-track="ds_ml">ML / DS</button>
        <button class="track-btn" data-track="analytics">Analytics</button>
        <button class="track-btn" data-track="business_analyst">Business</button>
        <button class="track-btn" data-track="quant">Quant</button>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">ATS Target Score</div>
      <div class="ats-row">
        <input type="range" id="atsSlider" min="70" max="100" value="90" step="5">
        <div class="ats-value" id="atsVal">90%</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="toolbar">
      <button class="btn btn-primary" onclick="generate('resume')">
        <span class="btn-icon">◎</span> Generate Resume
      </button>
      <button class="btn btn-secondary" onclick="generate('cover')">
        <span class="btn-icon">✉</span> Cover Letter
      </button>
      <div style="flex:1"></div>
      <button class="btn btn-success" id="dlResume" onclick="downloadResume()" disabled>
        <span class="btn-icon">↓</span> Resume DOCX
      </button>
      <button class="btn btn-success" id="dlCover" onclick="downloadCover()" disabled>
        <span class="btn-icon">↓</span> Cover DOCX
      </button>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-dot"></div>
      <span id="statusMsg"></span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="resume" onclick="switchTab('resume')">
        Resume <span class="badge" id="resumeBadge" style="display:none">✓</span>
      </div>
      <div class="tab" data-tab="cover" onclick="switchTab('cover')">
        Cover Letter <span class="badge" id="coverBadge" style="display:none">✓</span>
      </div>
    </div>

    <div class="content">
      <div id="resumeTab">
        <div class="empty-state" id="resumeEmpty">
          <div class="empty-icon">◎</div>
          <div class="empty-title">No resume generated yet</div>
          <div class="empty-sub">Fill in the fields and click Generate Resume</div>
        </div>
        <div id="resumePreview" class="preview-pane" style="display:none"></div>
      </div>
      <div id="coverTab" style="display:none">
        <div class="empty-state" id="coverEmpty">
          <div class="empty-icon">✉</div>
          <div class="empty-title">No cover letter yet</div>
          <div class="empty-sub">Click Cover Letter to generate one</div>
        </div>
        <div id="coverPreview" class="preview-pane" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let selectedTrack = null;
let resumeText = null;
let coverText = null;

// ── TRACK SELECTION ──
document.querySelectorAll('.track-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTrack = btn.dataset.track;
  };
});

// ── ATS SLIDER ──
const slider = document.getElementById('atsSlider');
const atsVal = document.getElementById('atsVal');
slider.oninput = () => { atsVal.textContent = slider.value + '%'; };

// ── TABS ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('resumeTab').style.display = name === 'resume' ? 'block' : 'none';
  document.getElementById('coverTab').style.display = name === 'cover' ? 'block' : 'none';
}

// ── STATUS ──
function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  const msgEl = document.getElementById('statusMsg');
  bar.className = 'status-bar show ' + type;
  msgEl.innerHTML = msg;
}

function clearStatus() {
  document.getElementById('statusBar').className = 'status-bar';
}

// ── PROMPTS ──
function getResumePrompt(company, title, loc, jd, track, atsScore) {
  const trackGuide = {
    sde: `SDE track: emphasize distributed systems, scalability, C++/Python/Java, system design, APIs, algorithms`,
    backend: `Backend track: emphasize Java/SQL/APIs, database optimization, microservices, server-side architecture`,
    ds_ml: `ML/DS track: emphasize PyTorch/TensorFlow, NLP, model training, F1/accuracy metrics, data pipelines, research`,
    analytics: `Analytics track: emphasize SQL, Tableau, Redshift, KPIs, ETL, business insights, data visualization`,
    business_analyst: `Business Analyst track: emphasize stakeholder communication, process improvement, SQL, dashboards, requirements`,
    quant: `Quant track: emphasize statistical modeling, Python/C++, risk models, XGBoost, time-series, accuracy metrics`
  };

  return `You are an expert ATS resume writer. Generate a polished, ATS-optimized resume for Dhruvin Jhaveri.

TARGET: ${atsScore}% ATS keyword match with this JD.
Track: ${trackGuide[track] || track}
Company: ${company}
Job Title: ${title}
Location for header: ${loc}

=== JOB DESCRIPTION ===
${jd}

=== CANDIDATE PROFILE ===
Name: Dhruvin Jhaveri
Phone: (602) 793-6561
Email: djhaveri99@gmail.com
LinkedIn: linkedin.com/in/dhruvinjhaveri
GitHub: github.com/Dhruvin255
Location: ${loc}

Education (list both, USC first):
- University of Southern California, Los Angeles, CA — M.S. Computer Science (Data Science), GPA: 3.40, May 2026
- NMIMS University, Mumbai, India — B.Tech. Computer Engineering, GPA: 3.61, May 2023

Experience (use exactly 3 based on track):
A) Software Development Engineer Intern | AWS (Amazon Web Services), Santa Clara, CA | May – Aug 2025
   Tech: C++, SQL, AWS Redshift, AWS S3, CI/CD, distributed systems
   - Engineered latency-aware C++ scaling framework for Redshift Serverless, improving query stability 35% across production
   - Designed auto-resizing mechanism with GUC config logic; built S3-based workload history for SQL scaling analytics
   - Built CI/CD pipelines with automated regression tests across 12 nodes, achieving 99.8% uptime

B) Product Enablement Intern | Imarticus Learning, Mumbai, India | Jan – May 2023
   Tech: Python, BERT, LangChain, Node.js, PostgreSQL, MongoDB, REST APIs
   - Designed NLP-driven evaluation system using BERT transformers, analyzing 50k+ daily events with 92% accuracy
   - Automated 90% of manual tagging workflows via Node.js microservices, saving 4 hours daily
   - Integrated REST API endpoints with PostgreSQL backend, enabling real-time analytics for 5 product managers

C) Data Analyst Intern | Paypoint India, Ahmedabad, India | Apr – Jul 2023
   Tech: Python, XGBoost, SQL, PostgreSQL, Tableau, Qlik Sense, Docker, AWS EC2
   - Built XGBoost credit risk model with RFE feature selection, achieving 94% accuracy on 1,000+ daily loan applications
   - Designed Tableau and Qlik Sense dashboards tracking 12 KPIs; identified patterns reducing default rate 18%
   - Implemented ETL pipelines using PostgreSQL and Python, processing 500k+ financial records daily

Projects:
P1) Full Stack Artist Search Application | Node.js, MongoDB, Express, JWT, MapReduce | Co-developed with Dhiren Oswal
   - Engineered 13 REST API endpoints with JWT authentication, achieving 172ms P95 latency across 10k concurrent users
   - Implemented MapReduce caching strategy, reducing duplicate API requests by 50% and improving throughput by 3x

P2) PharmaChain — Blockchain Supply Chain Platform | Ethereum, Solidity, Node.js, Web3.js
   - Built Ethereum smart contract system with off-chain aggregation layer, improving traceability by 95% across 4 suppliers
   - Achieved 25% on-chain efficiency improvement; 2nd place Study Australia Entrepreneurship Challenge, 4,000 AUD funding

P3) IEEE Publication — BERT Toxic Comment Classifier | Python, PyTorch, Scikit-learn
   - Trained multi-label BERT model on 160k comments; achieved F1 score of 0.91, published at IEEE ICISAA 2024

Skills to pick from by track:
- Languages: Python, C++, Java, SQL, JavaScript, TypeScript, Solidity
- Frameworks: Node.js, Express, Django, Flask, React, LangChain, PyTorch, TensorFlow, Scikit-learn
- Data/ML: XGBoost, BERT, NLP, MapReduce, Pandas, NumPy, Matplotlib
- Databases: PostgreSQL, MongoDB, MySQL, Redshift, DynamoDB
- Cloud/DevOps: AWS (S3, EC2, Redshift, Lambda), Docker, Git, CI/CD, REST APIs
- Tools: Tableau, Jupyter, Web3.js, JWT, Hadoop

=== STRICT ONE-PAGE BUDGET ===
HARD LIMIT: The entire resume MUST fit on ONE page. Follow exact counts below.

SECTION BUDGETS:
- Header: 2 lines
- Education: USC = 2 lines (degree+coursework on ONE line). NMIMS = 1 line. Total: 3 lines.
- Skills: 3 lines, one per subcategory
- Experience: EXACTLY 3 roles × EXACTLY 3 bullets = 9 bullets
- Projects: EXACTLY 2 projects × EXACTLY 2 bullets = 4 bullets

BULLET RULES:
- MAX 18 words per bullet. Count them. No padding.
- Pattern: [Strong verb] [what] [how/tool], [metric/result]
- BAD: "Collaborated with senior engineers on architecture reviews for query optimizer serving 10k+ clients, driving improvements"
- GOOD: "Optimized distributed query optimizer architecture; reduced P99 latency 35% across 10k+ enterprise clients"

TOTAL WORDS (excluding name/contact): 440-480 max.

=== OUTPUT FORMAT ===
Output ONLY plain text. Use this EXACT structure — every separator and line break matters:

DHRUVIN JHAVERI
[phone] | [email] | [linkedin] | [github] | [location]

EDUCATION
[University Name], [City, State] | [Degree], GPA: X.XX | [Month Year]
Relevant Coursework: [3-4 courses]
[University 2 Name], [City, Country] | [Degree], GPA: X.XX | [Month Year]

TECHNICAL SKILLS
Languages: [list]
Frameworks & Libraries: [list]
Databases & Cloud: [list]

EXPERIENCE
[Job Title] | [Company], [City, State] | [Date Range]
[Tech: comma-separated tech stack used in this role]
• [bullet]
• [bullet]
• [bullet]

[repeat for 3 experiences]

PROJECTS
[Project Name] | [Tech Stack]
• [bullet]
• [bullet]

[repeat for 2 projects]

CRITICAL FORMATTING NOTES:
- Education lines use pipe | separators — everything on ONE line per degree
- Experience header is ONE line: "Job Title | Company, City | Dates"
- Second line under each experience is "Tech: ..." — the stack used, comma-separated
- Exactly 3 experiences (always AWS; Imarticus for ML/backend/SDE; Paypoint for analytics/quant/business)
- Exactly 2 projects suited to track
- 3 skills subcategories only
- No soft skills, no personal pronouns, past tense
- Both degrees shown
- No OPT/visa language, no double hyphens`;
}

function getCoverPrompt(company, title, loc, jd) {
  return `Write a cover letter for Dhruvin Jhaveri applying to ${title} at ${company}.

Job Description:
${jd}

Background:
- USC MS CS (Data Science), graduating May 2026, GPA 3.40
- AWS SDE Intern: C++, petabyte-scale Redshift, 35% latency reduction
- ML Engineer: BERT NLP pipeline, 92% accuracy, LangChain
- Data Scientist: XGBoost credit risk model, 94% accuracy
- IEEE publication: BERT toxic comment classifier, F1 0.91
- Founded GDSC Coding Club, grew from 10 to 200+ members
- PharmaChain: 2nd place Study Australia Entrepreneurship, Harvard recognition
- Available mid-June 2026
- Relocating to NYC (dream city, fresh start)

RULES:
- 200-250 words total
- Bullet-style body (not paragraph essay)
- 4 short sections: Opening excitement, Best 2-3 experiences with metrics, Unique angle (leadership/research/entrepreneurship), Closing with NYC hook + availability
- Professional but energetic voice
- First person is fine
- No double hyphens anywhere (use comma or em dash instead)
- No OPT/visa language
- Do NOT repeat exact resume bullets verbatim; expand them
- Start with "Dear Hiring Manager,"
- End with contact info: djhaveri99@gmail.com | (602) 793-6561

Output ONLY the cover letter text, nothing else.`;
}

// ── GENERATE ──
async function generate(type) {
  const key = document.getElementById('apiKey').value.trim();
  const company = document.getElementById('company').value.trim();
  const title = document.getElementById('jobTitle').value.trim();
  const loc = document.getElementById('location').value.trim() || 'New York, NY';
  const jd = document.getElementById('jd').value.trim();
  const ats = document.getElementById('atsSlider').value;

  if (!key) return setStatus('API key required', 'error');
  if (!jd) return setStatus('Job description required', 'error');
  if (!selectedTrack) return setStatus('Select a track', 'error');

  const spinner = '<span class="spinner"></span>';
  setStatus(`${spinner} &nbsp;Generating ${type === 'resume' ? 'resume' : 'cover letter'}...`, 'info');

  // Disable buttons
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);

  const prompt = type === 'resume'
    ? getResumePrompt(company, title, loc, jd, selectedTrack, ats)
    : getCoverPrompt(company, title, loc, jd);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const text = data.content[0].text.trim();

    if (type === 'resume') {
      resumeText = text;
      document.getElementById('resumePreview').textContent = text;
      document.getElementById('resumePreview').style.display = 'block';
      document.getElementById('resumeEmpty').style.display = 'none';
      document.getElementById('resumeBadge').style.display = 'inline-flex';
      document.getElementById('dlResume').disabled = false;
      switchTab('resume');
    } else {
      coverText = text;
      document.getElementById('coverPreview').textContent = text;
      document.getElementById('coverPreview').style.display = 'block';
      document.getElementById('coverEmpty').style.display = 'none';
      document.getElementById('coverBadge').style.display = 'inline-flex';
      document.getElementById('dlCover').disabled = false;
      switchTab('cover');
    }

    setStatus('✓ Generated successfully', 'success');

  } catch (e) {
    setStatus('Error: ' + e.message, 'error');
    console.error(e);
  }

  // Re-enable buttons
  document.querySelectorAll('.btn').forEach(b => {
    if (b.id === 'dlResume' && !resumeText) return;
    if (b.id === 'dlCover' && !coverText) return;
    b.disabled = false;
  });
}

// ── DOCX GENERATION ──
// Compact format matching reference PDF:
// - Name large + bold centered
// - Contact line centered
// - Section headers: ALL CAPS bold with full-width bottom border, tight spacing
// - Education: pipe-separated single line per degree
// - Experience header: "Job Title | Company, City | Dates" on ONE line (bold, right-tab date)
//   followed by italic tech stack line
// - Bullets: indented, tight spacing
// - Projects: "Name | Stack" bold header, 2 bullets
// Font: Calibri throughout (clean, professional, compact)

function buildResumeXML(text) {
  const lines = text.split('\n');
  const paras = [];

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Font shorthand — Calibri 10pt
  const F = `<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>`;
  const SZ = `<w:sz w:val="20"/><w:szCs w:val="20"/>`;      // 10pt
  const SZN = `<w:sz w:val="19"/><w:szCs w:val="19"/>`;     // 9.5pt for tech line
  const SZH = `<w:sz w:val="26"/><w:szCs w:val="26"/>`;     // 13pt for name
  const SZS = `<w:sz w:val="22"/><w:szCs w:val="22"/>`;     // 11pt for section headers
  const rightTab = `<w:tabs><w:tab w:val="right" w:pos="9360"/></w:tabs>`;

  // Spacing helpers
  function sp(before, after) {
    return `<w:spacing w:before="${before}" w:after="${after}" w:line="240" w:lineRule="auto"/>`;
  }

  let i = 0;

  // ── LINE 0: Name ──
  if (lines[0]) {
    paras.push(`<w:p><w:pPr><w:jc w:val="center"/>${sp(0,40)}</w:pPr>
      <w:r><w:rPr><w:b/>${SZH}${F}</w:rPr><w:t>${esc(lines[0].trim())}</w:t></w:r></w:p>`);
    i = 1;
  }

  // ── LINE 1: Contact ──
  if (lines[1] && lines[1].trim()) {
    paras.push(`<w:p><w:pPr><w:jc w:val="center"/>${sp(0,120)}</w:pPr>
      <w:r><w:rPr>${SZ}${F}</w:rPr><w:t>${esc(lines[1].trim())}</w:t></w:r></w:p>`);
    i = 2;
  }

  while (i < lines.length) {
    const raw = lines[i];
    const t = raw.trim();

    // ── EMPTY LINE ── (skip, no spacer — tight layout)
    if (!t) { i++; continue; }

    // ── SECTION HEADER: all-caps word(s), no pipe ──
    if (/^[A-Z][A-Z\s\/&]+$/.test(t) && t.length > 2 && !t.includes('|')) {
      paras.push(`<w:p>
        <w:pPr>
          ${sp(140, 40)}
          <w:pBdr><w:bottom w:val="single" w:sz="8" w:space="1" w:color="1a1a1a"/></w:pBdr>
        </w:pPr>
        <w:r><w:rPr><w:b/>${SZS}${F}</w:rPr><w:t>${esc(t)}</w:t></w:r>
      </w:p>`);
      i++; continue;
    }

    // ── BULLET ──
    if (t.startsWith('•') || t.startsWith('-')) {
      const content = esc(t.replace(/^[•\-]\s*/,''));
      paras.push(`<w:p>
        <w:pPr><w:ind w:left="200" w:hanging="160"/>${sp(0,28)}</w:pPr>
        <w:r><w:rPr>${SZ}${F}</w:rPr><w:t xml:space="preserve">• ${content}</w:t></w:r>
      </w:p>`);
      i++; continue;
    }

    // ── TECH STACK LINE: starts with "Tech:" ──
    if (t.startsWith('Tech:')) {
      const content = esc(t.replace(/^Tech:\s*/,''));
      paras.push(`<w:p>
        <w:pPr>${sp(0,28)}</w:pPr>
        <w:r><w:rPr><w:i/>${SZN}${F}<w:color w:val="444444"/></w:rPr>
          <w:t xml:space="preserve">Tech: ${content}</w:t></w:r>
      </w:p>`);
      i++; continue;
    }

    // ── PIPE-SEPARATED LINE ── (Education OR Experience header OR Project header)
    if (t.includes('|')) {
      const parts = t.split('|').map(p => p.trim());

      // Education line: "University, City | Degree, GPA | Date"  (3 parts, last is date)
      const isEdu = parts.length >= 2 && /\d{4}/.test(parts[parts.length-1]) 
                    && (t.toLowerCase().includes('university') || t.toLowerCase().includes('institute') 
                        || t.toLowerCase().includes('college') || t.toLowerCase().includes('nmims')
                        || t.toLowerCase().includes('bachelor') || t.toLowerCase().includes('master')
                        || t.toLowerCase().includes('b.tech') || t.toLowerCase().includes('m.s'));

      // Experience header: "Job Title | Company, City | Date Range"
      const isExp = parts.length >= 2 && /\d{4}/.test(parts[parts.length-1])
                    && (t.toLowerCase().includes('intern') || t.toLowerCase().includes('engineer')
                        || t.toLowerCase().includes('scientist') || t.toLowerCase().includes('analyst')
                        || t.toLowerCase().includes('developer') || t.toLowerCase().includes('manager'));

      if (isEdu) {
        // Left side: university + degree, Right side: date
        const datePart = esc(parts[parts.length-1]);
        const leftParts = parts.slice(0, parts.length-1).map(esc).join('  |  ');
        paras.push(`<w:p>
          <w:pPr>${rightTab}${sp(0,28)}</w:pPr>
          <w:r><w:rPr><w:b/>${SZ}${F}</w:rPr><w:t xml:space="preserve">${leftParts}</w:t></w:r>
          <w:r><w:rPr>${SZ}${F}</w:rPr><w:tab/><w:t>${datePart}</w:t></w:r>
        </w:p>`);
        i++; continue;
      }

      if (isExp) {
        // "Job Title | Company, City | Date"
        const datePart = esc(parts[parts.length-1]);
        const titleAndCompany = parts.slice(0, parts.length-1).map(esc).join('  |  ');
        paras.push(`<w:p>
          <w:pPr>${rightTab}${sp(80,28)}</w:pPr>
          <w:r><w:rPr><w:b/>${SZ}${F}</w:rPr><w:t xml:space="preserve">${titleAndCompany}</w:t></w:r>
          <w:r><w:rPr>${SZ}${F}</w:rPr><w:tab/><w:t>${datePart}</w:t></w:r>
        </w:p>`);
        i++; continue;
      }

      // Project header: "Project Name | Tech Stack"
      const projLeft = esc(parts[0]);
      const projRight = parts.slice(1).map(esc).join(' | ');
      paras.push(`<w:p>
        <w:pPr>${sp(80,28)}</w:pPr>
        <w:r><w:rPr><w:b/>${SZ}${F}</w:rPr><w:t xml:space="preserve">${projLeft}</w:t></w:r>
        <w:r><w:rPr>${SZ}${F}</w:rPr><w:t xml:space="preserve"> | ${projRight}</w:t></w:r>
      </w:p>`);
      i++; continue;
    }

    // ── COURSEWORK / SKILLS line ── (starts with known label)
    if (/^(Relevant Coursework|Languages|Frameworks|Databases|Tools|Skills)/i.test(t)) {
      const colonIdx = t.indexOf(':');
      if (colonIdx > -1) {
        const label = esc(t.substring(0, colonIdx + 1));
        const val = esc(t.substring(colonIdx + 1).trim());
        paras.push(`<w:p><w:pPr>${sp(0,28)}</w:pPr>
          <w:r><w:rPr><w:b/>${SZ}${F}</w:rPr><w:t xml:space="preserve">${label} </w:t></w:r>
          <w:r><w:rPr>${SZ}${F}</w:rPr><w:t>${val}</w:t></w:r>
        </w:p>`);
        i++; continue;
      }
    }

    // ── DEFAULT: plain line ──
    paras.push(`<w:p><w:pPr>${sp(0,28)}</w:pPr>
      <w:r><w:rPr>${SZ}${F}</w:rPr><w:t>${esc(t)}</w:t></w:r>
    </w:p>`);
    i++;
  }

  return paras.join('\n');
}

function buildCoverXML(text) {
  const lines = text.split('\n');
  const paras = [];
  const F = `<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>`;

  function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  for (const line of lines) {
    const t = line.trim();
    if (!t) {
      paras.push(`<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`);
      continue;
    }
    if (t.startsWith('•') || t.startsWith('-')) {
      const bullet = esc(t.replace(/^[•\-]\s*/, ''));
      paras.push(`<w:p>
        <w:pPr><w:ind w:left="200" w:hanging="160"/><w:spacing w:after="60" w:line="240" w:lineRule="auto"/></w:pPr>
        <w:r><w:rPr><w:sz w:val="22"/><w:szCs w:val="22"/>${F}</w:rPr>
          <w:t xml:space="preserve">• ${bullet}</w:t></w:r>
      </w:p>`);
    } else {
      paras.push(`<w:p>
        <w:pPr><w:spacing w:after="120" w:line="240" w:lineRule="auto"/></w:pPr>
        <w:r><w:rPr><w:sz w:val="22"/><w:szCs w:val="22"/>${F}</w:rPr>
          <w:t>${esc(t)}</w:t></w:r>
      </w:p>`);
    }
  }
  return paras.join('\n');
}

async function makeDOCX(bodyXML, filename) {
  const zip = new JSZip();

  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/>
</Types>`);

  zip.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>
</Relationships>`);

  zip.file('word/settings.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:defaultTabStop w:val="720"/>
</w:settings>`);

  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <w:body>
    ${bodyXML}
    <w:sectPr>
      <w:pgSz w:w="12240" w:h="15840"/>
      <w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`);

  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function downloadResume() {
  if (!resumeText) return;
  const company = document.getElementById('company').value.trim() || 'Company';
  setStatus('<span class="spinner"></span>&nbsp; Building DOCX...', 'info');
  try {
    const xml = buildResumeXML(resumeText);
    await makeDOCX(xml, `Dhruvin_Jhaveri_Resume_${company.replace(/\s+/g,'_')}.docx`);
    setStatus('✓ Resume DOCX downloaded', 'success');
  } catch(e) {
    setStatus('DOCX error: ' + e.message, 'error');
    console.error(e);
  }
}

async function downloadCover() {
  if (!coverText) return;
  const company = document.getElementById('company').value.trim() || 'Company';
  setStatus('<span class="spinner"></span>&nbsp; Building DOCX...', 'info');
  try {
    const xml = buildCoverXML(coverText);
    await makeDOCX(xml, `Dhruvin_Jhaveri_CoverLetter_${company.replace(/\s+/g,'_')}.docx`);
    setStatus('✓ Cover Letter DOCX downloaded', 'success');
  } catch(e) {
    setStatus('DOCX error: ' + e.message, 'error');
    console.error(e);
  }
}
