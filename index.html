<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeForge</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #667eea;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
        }
        h1 { color: #667eea; margin-bottom: 20px; }
        label { display: block; margin: 15px 0 5px 0; font-weight: bold; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea { min-height: 150px; font-family: monospace; }
        .tracks {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .track {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            background: white;
        }
        .track:hover { border-color: #667eea; }
        .track.active { background: #667eea; color: white; border-color: #667eea; }
        .buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #667eea;
            color: white;
        }
        button:hover:not(:disabled) { background: #5568d3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .download { background: #28a745; }
        .download:hover:not(:disabled) { background: #218838; }
        #status {
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        #status.show { display: block; }
        #status.error { background: #f8d7da; color: #721c24; }
        #status.success { background: #d4edda; color: #155724; }
        #status.info { background: #d1ecf1; color: #0c5460; }
        #preview {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: Calibri, sans-serif;
            max-height: 500px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ResumeForge</h1>

        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-...">

        <label>Company</label>
        <input type="text" id="company" placeholder="Google">

        <label>Job Title</label>
        <input type="text" id="jobTitle" placeholder="Software Engineer">

        <label>Location</label>
        <input type="text" id="location" placeholder="New York, NY" value="New York, NY">

        <label>Job Description</label>
        <textarea id="jd" placeholder="Paste full job description..."></textarea>

        <label>Track</label>
        <div class="tracks">
            <div class="track" data-track="sde">SDE</div>
            <div class="track" data-track="backend">Backend</div>
            <div class="track" data-track="ds_ml">ML/DS</div>
            <div class="track" data-track="analytics">Analytics</div>
            <div class="track" data-track="business_analyst">Business</div>
            <div class="track" data-track="quant">Quant</div>
        </div>

        <div class="buttons">
            <button onclick="gen('resume')">Generate Resume</button>
            <button onclick="gen('cover')">Generate Cover Letter</button>
            <button class="download" onclick="download()" id="dlBtn" disabled>Download DOCX</button>
        </div>

        <div id="status"></div>
        <div id="preview"></div>
    </div>

    <script>
        let track = null;
        let resume = null;
        let cover = null;

        document.querySelectorAll('.track').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.track').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                track = t.dataset.track;
            };
        });

        function status(msg, type) {
            const s = document.getElementById('status');
            s.textContent = msg;
            s.className = 'show ' + type;
        }

        async function gen(type) {
            const key = document.getElementById('apiKey').value.trim();
            const company = document.getElementById('company').value.trim();
            const title = document.getElementById('jobTitle').value.trim();
            const loc = document.getElementById('location').value.trim();
            const jd = document.getElementById('jd').value.trim();

            if (!key) return status('Need API key', 'error');
            if (!jd) return status('Need job description', 'error');
            if (!track) return status('Select track', 'error');

            status(`Generating ${type}...`, 'info');

            const prompt = type === 'resume' ? 
`Generate ATS resume for Dhruvin Jhaveri.

Track: ${track}
Company: ${company}
Title: ${title}
Location: ${loc}

JD:
${jd}

Info:
- Dhruvin Jhaveri
- djhaveri99@gmail.com
- (602) 793-6561
- linkedin.com/in/dhruvinjhaveri
- github.com/Dhruvin255
- USC MS CS (Data Science), GPA 3.40, May 2026

Experience:
1. AWS - SDE Intern Redshift - Santa Clara, CA - Summer 2025
   - Built C++ scaling framework, 35% latency reduction
   - CI/CD pipelines, testing, monitoring
   - Petabyte-scale distributed systems

2. Paypoint India - Data Scientist - Mumbai - Summer 2022
   - Credit risk model, 94% accuracy, XGBoost
   - Tableau dashboards, KPIs
   - ETL pipelines, PostgreSQL

3. Imarticus Learning - ML Engineer - Mumbai - Jan-May 2023
   - NLP pipeline, 92% accuracy, BERT
   - 50k+ daily events processing
   - 90% automation increase

Skills: Python, C++, SQL, AWS, Docker, PostgreSQL, MongoDB, XGBoost, PyTorch, TensorFlow, Node.js, REST APIs

Projects:
- Artist Search (Node.js, MongoDB, 13 endpoints, 172ms latency)
- IEEE paper (BERT, F1 0.91)

Instructions:
- 1 page, ~550 words
- Linear format, no columns
- Extract keywords from JD
- Embed in skills/bullets
- ATS optimized

Return plain text.` :

`Generate cover letter for Dhruvin Jhaveri.

Company: ${company}
Title: ${title}
Location: ${loc}

JD:
${jd}

Background:
- USC MS CS grad May 2026
- AWS SDE intern, C++, distributed systems, 35% improvement
- Paypoint credit risk, 94% accuracy
- Imarticus NLP, 92% accuracy
- IEEE publication
- Founded coding club 10→200 members
- Available mid-June 2026

250-300 words, 4 paragraphs:
1. Excitement about role
2. Best experience + metrics
3. Unique angle (leadership/research)
4. Enthusiasm + call to action

Professional, energetic tone.`;

            try {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 4000,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || 'API error');
                }

                const data = await res.json();
                const text = data.content[0].text;

                if (type === 'resume') resume = text;
                else cover = text;

                document.getElementById('preview').textContent = text;
                document.getElementById('preview').style.display = 'block';
                status(`✅ ${type} done!`, 'success');
                
                if (resume || cover) document.getElementById('dlBtn').disabled = false;

            } catch (e) {
                status('Error: ' + e.message, 'error');
                console.error(e);
            }
        }

        async function download() {
            const company = document.getElementById('company').value.trim() || 'Company';
            status('Creating DOCX...', 'info');

            try {
                if (resume) await makeDOCX(resume, `Dhruvin_Jhaveri_Resume_${company}.docx`);
                if (cover) await makeDOCX(cover, `Dhruvin_Jhaveri_CoverLetter_${company}.docx`);
                status('✅ Downloaded!', 'success');
            } catch (e) {
                status('Error: ' + e.message, 'error');
            }
        }

        async function makeDOCX(text, name) {
            const zip = new JSZip();

            zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);

            zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);

            zip.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
</Relationships>`);

            const paras = text.split('\n').map(line => {
                const t = line.trim();
                if (!t) return '<w:p/>';
                const clean = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                if (t.startsWith('-') || t.startsWith('•')) {
                    return `<w:p><w:r><w:t>• ${clean.substring(1).trim()}</w:t></w:r></w:p>`;
                }
                return `<w:p><w:r><w:t>${clean}</w:t></w:r></w:p>`;
            }).join('');

            zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${paras}</w:body>
</w:document>`);

            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
