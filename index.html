<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge v6</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0e0e11;--surface:#17171c;--surface2:#1e1e26;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--accent:#7c6af7;--accent2:#5febc4;--text:#f0eff8;--muted:#8884a4;--danger:#f06b6b;--success:#5febc4;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh;}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:28px 24px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;position:sticky;top:0;height:100vh;}
.logo{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:18px;font-weight:600;letter-spacing:-0.3px;}
.logo-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.field-group{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}
input[type=text],input[type=password],textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s;}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent);}
input[type=password]{font-family:'DM Mono',monospace;font-size:13px;}
textarea{min-height:120px;resize:vertical;font-size:13px;line-height:1.5;}
.track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.track-btn{padding:9px 6px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;}
.track-btn:hover{border-color:var(--border2);color:var(--text);}
.track-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.divider{height:1px;background:var(--border);margin:2px 0;}
.main{display:flex;flex-direction:column;min-height:100vh;}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{padding:10px 18px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:#6a59e0;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
.btn-secondary:hover:not(:disabled){background:#26263a;}
.btn-green{background:#1a3a32;color:var(--success);border:1px solid #2a5a4a;}
.btn-green:hover:not(:disabled){background:#1f4a3e;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.status{padding:10px 28px;font-size:13px;display:none;align-items:center;gap:8px;}
.status.show{display:flex;}
.status.err{color:var(--danger);background:rgba(240,107,107,.08);}
.status.ok{color:var(--success);background:rgba(95,235,196,.08);}
.status.info{color:var(--accent2);background:rgba(95,235,196,.05);}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 28px;}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--success);color:#000;font-size:10px;margin-left:6px;}
.content{flex:1;padding:24px 28px;overflow-y:auto;}
.preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 32px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.75;color:#c8c4e8;white-space:pre-wrap;max-height:70vh;overflow-y:auto;min-height:200px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;gap:12px;color:var(--muted);}
.empty-icon{font-size:40px;opacity:.4;}
.empty-title{font-size:15px;font-weight:500;color:var(--text);opacity:.5;}
.empty-sub{font-size:13px;text-align:center;max-width:300px;line-height:1.5;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
@media(max-width:900px){.app{grid-template-columns:1fr;}.sidebar{position:static;height:auto;}}
</style>
</head>

// API CALL
// ═══════════════════════════════════════════════════════════
async function callAPI(key, prompt){
  var res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-opus-4-5',
      max_tokens:3000,
      messages:[{role:'user',content:prompt}]
    })
  });
  if(!res.ok){var e=await res.json();throw new Error(e.error&&e.error.message?e.error.message:'HTTP '+res.status);}
  var d=await res.json();
  return d.content[0].text.trim();
}

// PARSE AI RESPONSE

function parseTailored(text, track){
  var m = text.match(/OUTPUT_START([\s\S]*?)OUTPUT_END/);
  var block = m ? m[1] : text;

  function g(key){
    var r = block.match(new RegExp('^'+key+':\\s*(.+)$','m'));
    return r ? r[1].trim() : '';
  }

  var projOrder = getProjectOrder(track);
  var proj1key = projOrder[0], proj2key = projOrder[1];

  return {
    coursework: g('COURSEWORK'),
    skillLang:  g('SKILL_LANG'),
    skillFw:    g('SKILL_FW'),
    skillDb:    g('SKILL_DB'),
    exp1: [g('EXP1_B1'),g('EXP1_B2'),g('EXP1_B3')].filter(Boolean),
    exp2: [g('EXP2_B1'),g('EXP2_B2'),g('EXP2_B3')].filter(Boolean),
    exp3: [g('EXP3_B1'),g('EXP3_B2'),g('EXP3_B3')].filter(Boolean),
    exp4: [g('EXP4_B1'),g('EXP4_B2'),g('EXP4_B3')].filter(Boolean),
    proj1: { key:proj1key, bullets:[g('PROJ1_B1'),g('PROJ1_B2'),g('PROJ1_B3')].filter(Boolean) },
    proj2: { key:proj2key, bullets:[g('PROJ2_B1'),g('PROJ2_B2'),g('PROJ2_B3')].filter(Boolean) }
  };
}

// Fallback to defaults if AI parsing failed
function ensureBullets(aiArr, defaults){
  if(aiArr && aiArr.length>=2) return aiArr;
  return defaults;
}

// ═══════════════════════════════════════════════════════════
// GENERATE
// ═══════════════════════════════════════════════════════════
async function generate(type){
  var key     = document.getElementById('apiKey').value.trim();
  var company = document.getElementById('company').value.trim() || 'Company';
  var title   = document.getElementById('jobTitle').value.trim() || 'Role';
  var loc     = document.getElementById('location').value.trim() || 'New York, NY';
  var jd      = document.getElementById('jd').value.trim();

  if(!key)           return setS('API key required','err');
  if(!jd)            return setS('Paste a job description first','err');
  if(!selectedTrack) return setS('Select a track','err');

  lockBtns();

  if(type==='resume'){
    setS('<span class="spin"></span>&nbsp; Tailoring bullets to JD...','info');
    try{
      var raw = await callAPI(key, buildTailorPrompt(company,title,loc,jd,selectedTrack));
      var parsed = parseTailored(raw, selectedTrack);
      var projOrder = getProjectOrder(selectedTrack);

      resumeData = {
        loc:        loc,
        company:    company,
        coursework: parsed.coursework || 'Distributed Systems, Database Systems, Machine Learning, Algorithms',
        skillLang:  parsed.skillLang  || CANDIDATE.skillPools[selectedTrack].lang,
        skillFw:    parsed.skillFw    || CANDIDATE.skillPools[selectedTrack].fw,
        skillDb:    parsed.skillDb    || CANDIDATE.skillPools[selectedTrack].db,
        expBullets: [
          ensureBullets(parsed.exp1, CANDIDATE.experiences[0].defaultBullets),
          ensureBullets(parsed.exp2, CANDIDATE.experiences[1].defaultBullets),
          ensureBullets(parsed.exp3, CANDIDATE.experiences[2].defaultBullets),
          ensureBullets(parsed.exp4, CANDIDATE.experiences[3].defaultBullets)
        ],
        proj1: { key:projOrder[0], bullets:ensureBullets(parsed.proj1.bullets, CANDIDATE.projects[projOrder[0]].defaultBullets) },
        proj2: { key:projOrder[1], bullets:ensureBullets(parsed.proj2.bullets, CANDIDATE.projects[projOrder[1]].defaultBullets) }
      };

      // Show preview text
      var preview = buildPreviewText(resumeData);
      document.getElementById('rPreview').textContent = preview;
      document.getElementById('rPreview').style.display = 'block';
      document.getElementById('rEmpty').style.display = 'none';
      document.getElementById('rb').style.display = 'inline-flex';
      document.getElementById('dlR').disabled = false;
      switchTab('resume');
      setS('&#10003; Resume tailored — click Resume DOCX to download','ok');
    }catch(e){
      setS('Error: '+e.message,'err');
      console.error(e);
    }
  } else {
    setS('<span class="spin"></span>&nbsp; Writing cover letter...','info');
    try{
      coverText = await callAPI(key, buildCoverPrompt(company,title,loc,jd));
      document.getElementById('cPreview').textContent = coverText;
      document.getElementById('cPreview').style.display = 'block';
      document.getElementById('cEmpty').style.display = 'none';
      document.getElementById('cb').style.display = 'inline-flex';
      document.getElementById('dlC').disabled = false;
      switchTab('cover');
      setS('&#10003; Cover letter ready — click Cover DOCX to download','ok');
    }catch(e){
      setS('Error: '+e.message,'err');
      console.error(e);
    }
  }
  unlockBtns();
}

// ═══════════════════════════════════════════════════════════
// DOCX BUILDER — pure JSZip + validated XML
// ═══════════════════════════════════════════════════════════
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var F='<w:rFonts w:ascii="Calibri" w:cs="Calibri" w:eastAsia="Calibri" w:hAnsi="Calibri"/>';
function mkR(t,o){
  o=o||{};var sz=o.sz||19;
  var rp=F+(o.b?'<w:b/><w:bCs/>':'')+(o.i?'<w:i/><w:iCs/>':'')+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+(o.c?'<w:color w:val="'+o.c+'"/>':'');
  return '<w:r><w:rPr>'+rp+'</w:rPr><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>';
}
function sp(b,a,l){l=l||252;return '<w:spacing w:after="'+a+'" w:before="'+b+'" w:line="'+l+'" w:lineRule="auto"/>';}
var RT='<w:tabs><w:tab w:val="right" w:pos="10800"/></w:tabs>';

function pN(t){return '<w:p><w:pPr>'+sp(0,28)+'<w:jc w:val="center"/></w:pPr>'+mkR(t,{b:true,sz:26})+'</w:p>';}
function pC(t){return '<w:p><w:pPr>'+sp(0,110)+'<w:jc w:val="center"/></w:pPr>'+mkR(t,{sz:18})+'</w:p>';}
function pS(t){return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:color="1f3864" w:sz="6" w:space="1"/></w:pBdr>'+sp(118,36)+'</w:pPr>'+mkR(t,{b:true,sz:21,c:'1f3864'})+'</w:p>';}
function pE(l,d){return '<w:p><w:pPr>'+RT+sp(0,18)+'</w:pPr>'+mkR(l,{b:true})+mkR('\t'+d,{})+'</w:p>';}
function pCr(t){return '<w:p><w:pPr>'+sp(0,52)+'</w:pPr>'+mkR('Relevant Coursework: ',{b:true})+mkR(t,{})+'</w:p>';}
function pSk(l,v){return '<w:p><w:pPr>'+sp(0,18)+'</w:pPr>'+mkR(l+': ',{b:true})+mkR(v,{})+'</w:p>';}
function pXH(ti,co,dt){return '<w:p><w:pPr>'+RT+sp(72,14)+'</w:pPr>'+mkR(ti+'  |  '+co,{b:true})+mkR('\t'+dt,{b:true})+'</w:p>';}
function pT(t){return '<w:p><w:pPr>'+sp(0,16)+'</w:pPr>'+mkR('Tech: '+t,{i:true,sz:18,c:'444444'})+'</w:p>';}
function pB(t){return '<w:p><w:pPr><w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="2"/></w:numPr>'+sp(0,34)+'</w:pPr>'+mkR(t,{})+'</w:p>';}
function pPH(n,s){return '<w:p><w:pPr>'+sp(68,14)+'</w:pPr>'+mkR(n,{b:true})+mkR('  |  '+s,{sz:18,c:'444444'})+'</w:p>';}
function pMx(b,pl){return '<w:p><w:pPr>'+sp(0,0)+'</w:pPr>'+mkR(b,{b:true})+mkR(pl,{})+'</w:p>';}
function pPl(t){return '<w:p><w:pPr>'+sp(0,0)+'</w:pPr>'+mkR(t,{})+'</w:p>';}

function buildDocXML(d){
  var NS='xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" '
       + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '
       + 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '
       + 'xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" '
       + 'mc:Ignorable="w14"';
  var p=[];
  p.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  p.push('<w:document '+NS+'><w:body>');

  // Header
  p.push(pN(CANDIDATE.name));
  p.push(pC(CANDIDATE.phone+'  |  '+CANDIDATE.email+'  |  '+CANDIDATE.linkedin+'  |  '+CANDIDATE.github+'  |  '+d.loc));

  // Education
  p.push(pS('EDUCATION'));
  p.push(pE(CANDIDATE.edu[0].left, CANDIDATE.edu[0].date));
  p.push(pCr(d.coursework));
  p.push(pE(CANDIDATE.edu[1].left, CANDIDATE.edu[1].date));

  // Skills
  p.push(pS('TECHNICAL SKILLS'));
  p.push(pSk('Languages', d.skillLang));
  p.push(pSk('Frameworks & Libraries', d.skillFw));
  p.push(pSk('Databases & Cloud', d.skillDb));

  // Experience — always all 4
  p.push(pS('EXPERIENCE'));
  CANDIDATE.experiences.forEach(function(e,i){
    p.push(pXH(e.title, e.company, e.date));
    p.push(pT(e.tech));
    d.expBullets[i].forEach(function(b){ p.push(pB(b)); });
  });

  // Projects — 2, track-ordered
  p.push(pS('PROJECTS'));
  [d.proj1, d.proj2].forEach(function(pr){
    var proj = CANDIDATE.projects[pr.key];
    p.push(pPH(proj.name, proj.stack));
    pr.bullets.forEach(function(b){ p.push(pB(b)); });
  });

  // Publication
  p.push(pS('PUBLICATION'));
  p.push(pMx(CANDIDATE.pub.title, '  \u2014  '+CANDIDATE.pub.venue));
  p.push(pPl(CANDIDATE.pub.desc));

  // Leadership & Recognition — ALWAYS LAST, ALWAYS PRESENT (R1 rule)
  p.push(pS('LEADERSHIP \u0026 RECOGNITION'));
  CANDIDATE.leadership.forEach(function(l){
    p.push(pMx(l.title, '  \u2014  '+l.desc));
  });

  // ── QUALITY GATE ── paragraph count must be 47 ±2
  var paraCount = (p.join('').match(/<w:p[ >]/g)||[]).length;
  if(paraCount < 45 || paraCount > 52){
    console.warn('QC FAIL: paragraph count='+paraCount+' (expected 47±2). Check all 7 sections.');
  }

  // Page setup — R6: margins 720, R7: tab 10800
  p.push('<w:sectPr>'
    +'<w:pgSz w:w="12240" w:h="15840"/>'
    +'<w:pgMar w:top="432" w:right="720" w:bottom="432" w:left="720" w:header="360" w:footer="360" w:gutter="0"/>'
    +'</w:sectPr>');
  p.push('</w:body></w:document>');
  return p.join('');
}

async function makeDOCX(docXML, filename){
  if(typeof JSZip==='undefined') throw new Error('JSZip not loaded — reload the page');
  var zip = new JSZip();

  zip.file('_rels/.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    +'</Relationships>');

  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default ContentType="application/vnd.openxmlformats-package.relationships+xml" Extension="rels"/>'
    +'<Default ContentType="application/xml" Extension="xml"/>'
    +'<Override ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml" PartName="/word/document.xml"/>'
    +'<Override ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml" PartName="/word/styles.xml"/>'
    +'<Override ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml" PartName="/word/numbering.xml"/>'
    +'<Override ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml" PartName="/word/settings.xml"/>'
    +'</Types>');

  zip.file('word/_rels/document.xml.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'
    +'<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>'
    +'</Relationships>');

  zip.file('word/styles.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:docDefaults><w:rPrDefault/><w:pPrDefault/></w:docDefaults>'
    +'<w:style w:type="paragraph" w:styleId="ListParagraph">'
    +'<w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:qFormat/>'
    +'</w:style>'
    +'</w:styles>');

  zip.file('word/numbering.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:abstractNum w:abstractNumId="2">'
    +'<w:multiLevelType w:val="hybridMultilevel"/>'
    +'<w:lvl w:ilvl="0">'
    +'<w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="&#x2022;"/><w:lvlJc w:val="left"/>'
    +'<w:pPr><w:spacing w:after="22"/><w:ind w:left="280" w:hanging="200"/></w:pPr>'
    +'<w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/><w:sz w:val="19"/><w:szCs w:val="19"/></w:rPr>'
    +'</w:lvl>'
    +'</w:abstractNum>'
    +'<w:num w:numId="2"><w:abstractNumId w:val="2"/></w:num>'
    +'</w:numbering>');

  zip.file('word/settings.xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:compat><w:compatSetting w:val="15" w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word"/></w:compat>'
    +'</w:settings>');

  zip.file('word/document.xml', docXML);

  var content = await zip.generateAsync({type:'uint8array'});
  var blob = new Blob([content],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}

async function downloadResume(){
  if(!resumeData) return;
  setS('<span class="spin"></span>&nbsp; Building DOCX...','info');
  try{
    var xml = buildDocXML(resumeData);
    var co  = document.getElementById('company').value.trim()||'Company';
    await makeDOCX(xml,'Dhruvin_Jhaveri_Resume_'+co.replace(/\s+/g,'_')+'.docx');
    setS('&#10003; Resume DOCX downloaded','ok');
  }catch(e){ setS('DOCX error: '+e.message,'err'); console.error(e); }
}

// ─── COVER LETTER DOCX ─────────────────────────────────────
async function downloadCover(){
  if(!coverText) return;
  setS('<span class="spin"></span>&nbsp; Building DOCX...','info');
  try{
    var rpr='<w:rFonts w:ascii="Calibri" w:cs="Calibri" w:hAnsi="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/>';
    var paras = coverText.split('\n').map(function(line){
      var t=line.trim();
      if(!t) return '<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>';
      if(t[0]==='\u2022'||t[0]==='-')
        return '<w:p><w:pPr><w:ind w:left="280" w:hanging="200"/><w:spacing w:after="80" w:line="240" w:lineRule="auto"/></w:pPr>'
              +'<w:r><w:rPr>'+rpr+'</w:rPr><w:t xml:space="preserve">\u2022 '+esc(t.replace(/^[\u2022\-]\s*/,''))+'</w:t></w:r></w:p>';
      return '<w:p><w:pPr><w:spacing w:after="140" w:line="240" w:lineRule="auto"/></w:pPr>'
            +'<w:r><w:rPr>'+rpr+'</w:rPr><w:t>'+esc(t)+'</w:t></w:r></w:p>';
    }).join('');
    var docXML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
      +paras
      +'<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080"/></w:sectPr>'
      +'</w:body></w:document>';
    var co = document.getElementById('company').value.trim()||'Company';
    await makeDOCX(docXML,'Dhruvin_Jhaveri_CoverLetter_'+co.replace(/\s+/g,'_')+'.docx');
    setS('&#10003; Cover Letter DOCX downloaded','ok');
  }catch(e){ setS('DOCX error: '+e.message,'err'); console.error(e); }
}
