<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0e0e11;
    --surface: #17171c;
    --surface2: #1e1e26;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --accent: #7c6af7;
    --accent2: #5febc4;
    --text: #f0eff8;
    --muted: #8884a4;
    --danger: #f06b6b;
    --success: #5febc4;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-version { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }

  .field-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
  }

  input[type="text"], input[type="password"], textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    transition: border-color 0.15s;
    outline: none;
  }

  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    border-color: var(--accent);
  }

  input[type="password"] { font-family: 'DM Mono', monospace; font-size: 13px; }
  textarea { min-height: 110px; resize: vertical; font-size: 13px; line-height: 1.5; }

  .track-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }

  .track-btn {
    padding: 9px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface2);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .track-btn:hover { border-color: var(--border2); color: var(--text); }
  .track-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .main {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: #6a59e0; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .btn-secondary:hover:not(:disabled) { background: #26263a; }
  .btn-success { background: #1a3a32; color: var(--success); border: 1px solid #2a5a4a; }
  .btn-success:hover:not(:disabled) { background: #1f4a3e; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-icon { font-size: 16px; }

  .status-bar {
    padding: 10px 28px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .status-bar.show { display: flex; }
  .status-bar.error { color: var(--danger); background: rgba(240,107,107,0.08); }
  .status-bar.success { color: var(--success); background: rgba(95,235,196,0.08); }
  .status-bar.info { color: var(--accent2); background: rgba(95,235,196,0.05); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
  }

  .tab {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--success); color: #000;
    font-size: 10px; margin-left: 6px;
  }

  .content {
    flex: 1;
    padding: 24px 28px;
    overflow-y: auto;
  }

  .preview-pane {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    line-height: 1.7;
    color: #c8c4e8;
    white-space: pre-wrap;
    max-height: 65vh;
    overflow-y: auto;
    min-height: 200px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    gap: 12px;
    color: var(--muted);
  }

  .empty-icon { font-size: 40px; opacity: 0.4; }
  .empty-title { font-size: 16px; font-weight: 500; color: var(--text); opacity: 0.5; }
  .empty-sub { font-size: 13px; text-align: center; max-width: 300px; line-height: 1.5; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ats-row { display: flex; align-items: center; gap: 12px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
  .ats-value {
    font-family: 'DM Mono', monospace;
    font-size: 14px; font-weight: 500;
    color: var(--accent2); min-width: 36px; text-align: right;
  }

  .divider { height: 1px; background: var(--border); margin: 4px 0; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <div>
        <div class="logo-text">ResumeForge</div>
        <div class="logo-version">v3.0 — Tight Layout Engine</div>
      </div>
    </div>

    <div class="field-group">

    <div class="divider"></div>

      <div class="field-label">Track</div>
      <div class="track-grid">
        <button class="track-btn" data-track="sde">SDE</button>

    </div>

      <div class="field-label">ATS Target Score</div>
      <div class="ats-row">
        <input type="range" id="atsSlider" min="70" max="100" value="90" step="5">

      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="toolbar">
      <button class="btn btn-primary" onclick="generate('resume')">
        <span class="btn-icon">◎</span> Generate Resume
      </button>
      <button class="btn btn-secondary" onclick="generate('cover')">
        <span class="btn-icon">✉</span> Cover Letter
      </button>
      <div style="flex:1"></div>
      <button class="btn btn-success" id="dlResume" onclick="downloadResume()" disabled>
        <span class="btn-icon">↓</span> Resume DOCX
      </button>
      <button class="btn btn-success" id="dlCover" onclick="downloadCover()" disabled>
        <span class="btn-icon">↓</span> Cover DOCX
      </button>
    </div>

    <div class="status-bar" id="statusBar">
      <div class="status-dot"></div>
      <span id="statusMsg"></span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="resume" onclick="switchTab('resume')">
        Resume <span class="badge" id="resumeBadge" style="display:none">✓</span>
      </div>
      <div class="tab" data-tab="cover" onclick="switchTab('cover')">
        Cover Letter <span class="badge" id="coverBadge" style="display:none">✓</span>
      </div>
    </div>

    <div class="content">
      <div id="resumeTab">
        <div class="empty-state" id="resumeEmpty">
          <div class="empty-icon">◎</div>
          <div class="empty-title">No resume generated yet</div>
          <div class="empty-sub">Fill in the fields and click Generate Resume</div>
        </div>
        <div id="resumePreview" class="preview-pane" style="display:none"></div>
      </div>
      <div id="coverTab" style="display:none">
        <div class="empty-state" id="coverEmpty">
          <div class="empty-icon">✉</div>
          <div class="empty-title">No cover letter yet</div>
          <div class="empty-sub">Click Cover Letter to generate one</div>
        </div>
        <div id="coverPreview" class="preview-pane" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- docx browser bundle -->

<script>
// ── STATE ──
let selectedTrack = null;
let resumeText = null;
let coverText = null;

// ── TRACK SELECTION ──
document.querySelectorAll('.track-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.track-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTrack = btn.dataset.track;
  };
});

// ── ATS SLIDER ──
const slider = document.getElementById('atsSlider');
const atsVal = document.getElementById('atsVal');
slider.oninput = () => { atsVal.textContent = slider.value + '%'; };

// ── TABS ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('resumeTab').style.display = name === 'resume' ? 'block' : 'none';
  document.getElementById('coverTab').style.display = name === 'cover' ? 'block' : 'none';
}

// ── STATUS ──
function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.className = 'status-bar show ' + type;
  document.getElementById('statusMsg').innerHTML = msg;
}
function clearStatus() { document.getElementById('statusBar').className = 'status-bar'; }

// ══════════════════════════════════════════════════════
// ── GENERATE (API CALL) ──
// ══════════════════════════════════════════════════════

async function generate(type) {
  const key     = document.getElementById('apiKey').value.trim();
  const company = document.getElementById('company').value.trim();
  const title   = document.getElementById('jobTitle').value.trim();
  const loc     = document.getElementById('location').value.trim() || 'New York, NY';
  const jd      = document.getElementById('jd').value.trim();
  const ats     = document.getElementById('atsSlider').value;

  if (!key)            return setStatus('API key required', 'error');
  if (!jd)             return setStatus('Job description required', 'error');
  if (!selectedTrack)  return setStatus('Select a track', 'error');

  setStatus('<span class="spinner"></span>&nbsp; Generating ' + (type === 'resume' ? 'resume' : 'cover letter') + '...', 'info');
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);

  const prompt = type === 'resume'
    ? getResumePrompt(company, title, loc, jd, selectedTrack, ats)
    : getCoverPrompt(company, title, loc, jd);

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 4096,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || `HTTP ${res.status}`);
    }

    const data = await res.json();
    const text = data.content[0].text.trim();

    if (type === 'resume') {
      resumeText = text;
      document.getElementById('resumePreview').textContent = text;
      document.getElementById('resumePreview').style.display = 'block';
      document.getElementById('resumeEmpty').style.display = 'none';
      document.getElementById('resumeBadge').style.display = 'inline-flex';
      document.getElementById('dlResume').disabled = false;
      switchTab('resume');
    } else {
      coverText = text;
      document.getElementById('coverPreview').textContent = text;
      document.getElementById('coverPreview').style.display = 'block';
      document.getElementById('coverEmpty').style.display = 'none';
      document.getElementById('coverBadge').style.display = 'inline-flex';
      document.getElementById('dlCover').disabled = false;
      switchTab('cover');
    }

    setStatus('✓ Generated successfully', 'success');
  } catch(e) {
    setStatus('Error: ' + e.message, 'error');
  }

  document.querySelectorAll('.btn').forEach(b => {
    if (b.id === 'dlResume' && !resumeText) return;
    if (b.id === 'dlCover' && !coverText) return;
    b.disabled = false;
  });
}

// ══════════════════════════════════════════════════════
// ── DOCX BUILDER — exact spacing from validated Node build ──
// ══════════════════════════════════════════════════════

function parseResumeFields(text) {
  // Extract RESUME_START...RESUME_END block
  const match = text.match(/RESUME_START([\s\S]*?)RESUME_END/);
  const block = match ? match[1] : text;

  const get = (key) => {
    const m = block.match(new RegExp(`^${key}:\\s*(.+)$`, 'm'));
    return m ? m[1].trim() : '';
  };

  return {
    name:       get('NAME'),
    contact:    get('CONTACT'),
    edu1Left:   get('EDU1_LEFT'),
    edu1Date:   get('EDU1_DATE'),
    edu1Course: get('EDU1_COURSE'),
    edu2Left:   get('EDU2_LEFT'),
    edu2Date:   get('EDU2_DATE'),
    skill1Label: get('SKILL1_LABEL'), skill1Value: get('SKILL1_VALUE'),
    skill2Label: get('SKILL2_LABEL'), skill2Value: get('SKILL2_VALUE'),
    skill3Label: get('SKILL3_LABEL'), skill3Value: get('SKILL3_VALUE'),
    exps: [1,2,3].map(i => ({
      title:   get(`EXP${i}_TITLE`),
      company: get(`EXP${i}_COMPANY`),
      date:    get(`EXP${i}_DATE`),
      tech:    get(`EXP${i}_TECH`),
      bullets: [1,2,3].map(j => get(`EXP${i}_B${j}`)).filter(Boolean)
    })).filter(e => e.title),
    projs: [1,2].map(i => ({
      name:    get(`PROJ${i}_NAME`),
      stack:   get(`PROJ${i}_STACK`),
      bullets: [1,2,3].map(j => get(`PROJ${i}_B${j}`)).filter(Boolean)
    })).filter(p => p.name),
    pubTitle:  get('PUB_TITLE'),
    pubVenue:  get('PUB_VENUE'),
    pubDesc:   get('PUB_DESC'),
  };
}

async function buildResumeDOCX(text, filename) {
  const {
    Document, Paragraph, TextRun, Packer,
    AlignmentType, LevelFormat, TabStopType, BorderStyle
  } = docx;

  const f = parseResumeFields(text);

  // ── Spacing constants (exact values from validated Node.js build) ──
  const FONT    = "Calibri";
  const SZ_NAME = 26;  // 13pt
  const SZ_CONT = 18;  // 9pt
  const SZ_SEC  = 21;  // 10.5pt
  const SZ_BODY = 19;  // 9.5pt
  const SZ_TECH = 18;  // 9pt
  const RIGHT_TAB = 9504;

  const sp = (before, after, line = 252) => ({ before, after, line, lineRule: "auto" });

  // ── Helper builders ──
  const mkName = (t) => new Paragraph({
    alignment: AlignmentType.CENTER,
    spacing: sp(0, 28),
    children: [new TextRun({ text: t, font: FONT, size: SZ_NAME, bold: true })]
  });

  const mkContact = (t) => new Paragraph({
    alignment: AlignmentType.CENTER,
    spacing: sp(0, 110),
    children: [new TextRun({ text: t, font: FONT, size: SZ_CONT })]
  });

  const mkSection = (t) => new Paragraph({
    spacing: sp(118, 36),
    border: { bottom: { style: BorderStyle.SINGLE, size: 6, color: "1f3864", space: 1 } },
    children: [new TextRun({ text: t, font: FONT, size: SZ_SEC, bold: true, color: "1f3864" })]
  });

  const mkEduLine = (left, date) => new Paragraph({
    spacing: sp(0, 18),
    tabStops: [{ type: TabStopType.RIGHT, position: RIGHT_TAB }],
    children: [
      new TextRun({ text: left, font: FONT, size: SZ_BODY, bold: true }),
      new TextRun({ text: "\t" + date, font: FONT, size: SZ_BODY })
    ]
  });

  const mkCourse = (t) => new Paragraph({
    spacing: sp(0, 52),
    children: [
      new TextRun({ text: "Relevant Coursework: ", font: FONT, size: SZ_BODY, bold: true }),
      new TextRun({ text: t, font: FONT, size: SZ_BODY })
    ]
  });

  const mkSkill = (label, value) => new Paragraph({
    spacing: sp(0, 18),
    children: [
      new TextRun({ text: label + ": ", font: FONT, size: SZ_BODY, bold: true }),
      new TextRun({ text: value, font: FONT, size: SZ_BODY })
    ]
  });

  const mkExpHeader = (title, company, date) => new Paragraph({
    spacing: sp(72, 14),
    tabStops: [{ type: TabStopType.RIGHT, position: RIGHT_TAB }],
    children: [
      new TextRun({ text: `${title}  |  ${company}`, font: FONT, size: SZ_BODY, bold: true }),
      new TextRun({ text: "\t" + date, font: FONT, size: SZ_BODY, bold: true })
    ]
  });

  const mkTech = (t) => new Paragraph({
    spacing: sp(0, 16),
    children: [new TextRun({ text: "Tech: " + t, font: FONT, size: SZ_TECH, italics: true, color: "444444" })]
  });

  const mkBullet = (t) => new Paragraph({
    spacing: sp(0, 34),
    numbering: { reference: "bullets", level: 0 },
    children: [new TextRun({ text: t, font: FONT, size: SZ_BODY })]
  });

  const mkProjHeader = (name, stack) => new Paragraph({
    spacing: sp(68, 14),
    children: [
      new TextRun({ text: name, font: FONT, size: SZ_BODY, bold: true }),
      new TextRun({ text: "  |  " + stack, font: FONT, size: SZ_TECH, color: "444444" })
    ]
  });

  // ── Assemble children ──
  const children = [];

  // Header
  children.push(mkName(f.name || "DHRUVIN JHAVERI"));
  children.push(mkContact(f.contact));

  // Education
  children.push(mkSection("EDUCATION"));
  children.push(mkEduLine(f.edu1Left, f.edu1Date));
  if (f.edu1Course) children.push(mkCourse(f.edu1Course));
  children.push(mkEduLine(f.edu2Left, f.edu2Date));

  // Skills
  children.push(mkSection("TECHNICAL SKILLS"));
  children.push(mkSkill(f.skill1Label, f.skill1Value));
  children.push(mkSkill(f.skill2Label, f.skill2Value));
  children.push(mkSkill(f.skill3Label, f.skill3Value));

  // Experience
  children.push(mkSection("EXPERIENCE"));
  for (const exp of f.exps) {
    children.push(mkExpHeader(exp.title, exp.company, exp.date));
    if (exp.tech) children.push(mkTech(exp.tech));
    for (const b of exp.bullets) children.push(mkBullet(b));
  }

  // Projects
  children.push(mkSection("PROJECTS"));
  for (const proj of f.projs) {
    children.push(mkProjHeader(proj.name, proj.stack));
    for (const b of proj.bullets) children.push(mkBullet(b));
  }

  // Publication
  if (f.pubTitle) {
    children.push(mkSection("PUBLICATION"));
    children.push(new Paragraph({
      spacing: sp(0, 0),
      children: [
        new TextRun({ text: f.pubTitle, font: FONT, size: SZ_BODY, bold: true }),
        new TextRun({ text: "  —  " + f.pubVenue, font: FONT, size: SZ_BODY })
      ]
    }));
    if (f.pubDesc) children.push(new Paragraph({
      spacing: sp(0, 0),
      children: [new TextRun({ text: f.pubDesc, font: FONT, size: SZ_BODY })]
    }));
  }

  // ── Build Document ──
  const doc = new Document({
    numbering: {
      config: [{
        reference: "bullets",
        levels: [{
          level: 0,
          format: LevelFormat.BULLET,
          text: "\u2022",
          alignment: AlignmentType.LEFT,
          style: {
            paragraph: {
              indent: { left: 280, hanging: 200 },
              spacing: { after: 22 }
            }
          }
        }]
      }]
    },
    sections: [{
      properties: {
        page: {
          size: { width: 12240, height: 15840 },
          margin: { top: 432, right: 648, bottom: 432, left: 648 }
        }
      },
      children
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function buildCoverDOCX(text, filename) {
  const { Document, Paragraph, TextRun, Packer, AlignmentType, BorderStyle } = docx;

  const FONT = "Calibri";
  const lines = text.split('\n');
  const children = [];

  for (const line of lines) {
    const t = line.trim();
    if (!t) {
      children.push(new Paragraph({ spacing: { after: 0 } }));
      continue;
    }
    if (t.startsWith('•') || t.startsWith('-')) {
      children.push(new Paragraph({
        spacing: { after: 80, line: 240, lineRule: "auto" },
        indent: { left: 280, hanging: 200 },
        children: [new TextRun({ text: '• ' + t.replace(/^[•\-]\s*/, ''), font: FONT, size: 22 })]
      }));
    } else {
      children.push(new Paragraph({
        spacing: { after: 140, line: 240, lineRule: "auto" },
        children: [new TextRun({ text: t, font: FONT, size: 22 })]
      }));
    }
  }

  const doc = new Document({
    sections: [{
      properties: {
        page: {
          size: { width: 12240, height: 15840 },
          margin: { top: 1080, right: 1080, bottom: 1080, left: 1080 }
        }
      },
      children
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ── DOWNLOAD HANDLERS ──
async function downloadResume() {
  if (!resumeText) return;
  const company = document.getElementById('company').value.trim() || 'Company';
  setStatus('<span class="spinner"></span>&nbsp; Building DOCX...', 'info');
  try {
    await buildResumeDOCX(resumeText, `Dhruvin_Jhaveri_Resume_${company.replace(/\s+/g,'_')}.docx`);
    setStatus('✓ Resume DOCX downloaded', 'success');
  } catch(e) {
    setStatus('DOCX error: ' + e.message, 'error');
    console.error(e);
  }
}

async function downloadCover() {
  if (!coverText) return;
  const company = document.getElementById('company').value.trim() || 'Company';
  setStatus('<span class="spinner"></span>&nbsp; Building DOCX...', 'info');
  try {
    await buildCoverDOCX(coverText, `Dhruvin_Jhaveri_CoverLetter_${company.replace(/\s+/g,'_')}.docx`);
    setStatus('✓ Cover Letter DOCX downloaded', 'success');
  } catch(e) {
    setStatus('DOCX error: ' + e.message, 'error');
    console.error(e);
  }
}
